<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>和弦测试 · 木色主题</title>
    <!-- DNS 预解析 + 预连接，加速 CDN 资源加载 -->
    <link rel="dns-prefetch" href="https://cdn.staticfile.org">
    <link rel="dns-prefetch" href="https://cdn.bootcdn.net">
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdn.staticfile.org" crossorigin>
    <link rel="preconnect" href="https://cdn.bootcdn.net" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<script>(function(){var t=localStorage.getItem('theme');if(!t||t!=='dark')document.documentElement.setAttribute('data-theme','light');})();</script>
    <link rel="stylesheet" href="https://cdn.staticfile.org/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/static/css/base.css?v={{ APP_VERSION }}">
    <link rel="stylesheet" href="/static/css/solo.css?v={{ APP_VERSION }}">
</head>
<body>
    <div id="particles"></div>

    <div class="header">
        <h2><i class="fas fa-guitar" aria-hidden="true"></i> 和弦测试 · 木色典藏版</h2>
        <div class="header-actions">
            <button class="back-btn" onclick="window.location.href='/teach'"><i class="fas fa-chalkboard-teacher" aria-hidden="true"></i> 教学驾驶舱</button>
            <button class="back-btn" onclick="window.location.href='/'"><i class="fas fa-arrow-left" aria-hidden="true"></i> 返回主页</button>
        </div>
    </div>

    <div class="train-layout" id="trainLayout">
        <!-- 左侧摄像头与统计 -->
        <div class="left-panel">
            <div class="camera-container" id="cameraContainer">
                <video id="cameraFeed" autoplay playsinline></video>
                <div class="camera-hint" id="cameraHint"><i class="fas fa-video"></i> 点击「开启摄像头」开始</div>
                <div class="camera-status">
                    <span id="cameraStatus"><i class="fas fa-camera" aria-hidden="true"></i> 摄像头已关闭</span>
                    <span id="perfIndicator" style="display:none;font-size:0.78rem;color:#a5d6a5;font-family:monospace;margin-left:8px;"></span>
                    <div class="camera-actions">
                        <button id="fullscreenVideoBtn"><i class="fas fa-expand" aria-hidden="true"></i> 全屏</button>
                        <button id="toggleCamera"><i class="fas fa-video" aria-hidden="true"></i> 开启摄像头</button>
                    </div>
                </div>
            </div>
            <div class="stat-panel">
                <div class="section-title soft"><i class="fas fa-chart-column" aria-hidden="true"></i> 本次测试统计</div>
                <div class="stat-row">正确 <span id="statCorrect">0</span></div>
                <div class="stat-row">错误 <span id="statWrong">0</span></div>
                <div class="stat-row">正确率 <span id="statRate">0%</span></div>
            </div>
        </div>

        <!-- 中间指板 -->
        <div class="center-panel">
            <div class="center-panel-header">
                <div class="section-title soft"><i class="fas fa-hand-paper" aria-hidden="true"></i> 指法示意</div>
                <div class="chord-heading">
                    <div class="chord-title-wrap">
                        <span class="difficulty-badge" id="difficultyBadge"></span>
                        <h4 id="currentChordName" class="chord-title">未选择和弦</h4>
                    </div>
                </div>
            </div>
            <div class="fretboard-mini" id="fretboardMini">
                <!-- 品柱 (共5条) -->
                <div class="fret-mini" data-fret="1"></div>
                <div class="fret-mini" data-fret="2"></div>
                <div class="fret-mini" data-fret="3"></div>
                <div class="fret-mini" data-fret="4"></div>
                <div class="fret-mini" data-fret="5"></div>
                <div class="fret-label" data-fret="1">1</div>
                <div class="fret-label" data-fret="2">2</div>
                <div class="fret-label" data-fret="3">3</div>
                <div class="fret-label" data-fret="4">4</div>
                <div class="fret-label" data-fret="5">5</div>

                <!-- 琴弦线条 (6弦~1弦) -->
                <div class="string-mini" data-string="6"></div>
                <div class="string-mini" data-string="5"></div>
                <div class="string-mini" data-string="4"></div>
                <div class="string-mini" data-string="3"></div>
                <div class="string-mini" data-string="2"></div>
                <div class="string-mini" data-string="1"></div>

                <div class="string-label" data-string="6">6</div>
                <div class="string-label" data-string="5">5</div>
                <div class="string-label" data-string="4">4</div>
                <div class="string-label" data-string="3">3</div>
                <div class="string-label" data-string="2">2</div>
                <div class="string-label" data-string="1">1</div>

                <div class="dot-container" id="dotContainer"></div>
            </div>
            <div class="fretboard-hint">👆 指板显示标准按法，绿色圆点 = 你按的位置</div>
            <div class="chord-select">
                <label for="chordSelect" class="panel-label"><i class="fas fa-book-open" aria-hidden="true"></i> 选择和弦</label>
            <button class="btn-custom" id="chordPopupBtn" type="button" style="width:100%">
                <i class="fas fa-guitar"></i> <span id="chordPopupLabel">选择和弦</span>
            </button>
            <select id="chordSelect" style="display:none;"></select>
            </div>
        </div>

        <!-- 右侧控制区 -->
        <div class="right-panel">
            <!-- 测试列表区域 -->
            <div>
                <div class="test-section-title"><i class="fas fa-list-check" aria-hidden="true"></i> 测试列表 (<span id="testCount">0</span>)</div>
                <div class="test-list" id="testListDiv"></div>
                <div style="display: flex; gap:5px; margin-top:5px;">
                    <button class="btn-custom btn-sm" id="clearTestBtn" style="flex:1;"><i class="fas fa-broom" aria-hidden="true"></i> 清空</button>
                </div>
            </div>
            <div class="test-progress-area">
                <div class="section-title soft"><i class="fas fa-route" aria-hidden="true"></i> 当前测试进度</div>
                <div class="progress-row">
                    <span>进度</span>
                    <span id="progressDisplay">0/0</span>
                </div>
                <div class="progress-row">
                    <span>当前用时</span>
                    <span id="currentTimeDisplay">0.0 s</span>
                </div>
                <div class="progress-row" style="justify-content: center; margin-top: 8px;">
                    <button class="btn-custom" id="toggleQuickMode" type="button" style="width:80%;">
                         快速模式：<span id="quickModeState">关</span>
                    </button>
                </div>
                <div class="progress-actions">
                    <button class="btn-custom btn-primary" id="startTestBtn"><i class="fas fa-play" aria-hidden="true"></i> 开始测试</button>
                    <button class="btn-custom btn-warning" id="skipBtn">
                        <span class="skip-btn-content">
                            <span><i class="fas fa-forward-step" aria-hidden="true"></i> 跳过当前</span>
                            <span class="skip-btn-note">(记为错误)</span>
                        </span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 正确/错误即时反馈 -->
    <div class="result-flash" id="resultFlash"></div>

<!-- 和弦选择模态窗口 -->
<div class="chord-modal-overlay" id="chordModal">
    <div class="chord-modal-card">
        <div class="chord-modal-header">
            <h3>选择和弦</h3>
            <button class="chord-modal-close" id="closeChordModal">&times;</button>
        </div>
        <input type="text" class="chord-modal-search" id="chordPopupSearch" placeholder="搜索和弦（支持拼音首字母）...">
        <div class="chord-category-tabs" id="chordCatTabs">
            <button class="chord-cat-tab active" data-cat="all">全部</button>
            <button class="chord-cat-tab" data-cat="1">基础</button>
            <button class="chord-cat-tab" data-cat="2">进阶</button>
            <button class="chord-cat-tab" data-cat="3">高级</button>
        </div>
        <div class="chord-recent-row" id="chordRecentRow">
            <span class="chord-recent-label">最近:</span>
        </div>
        <div class="chord-modal-list" id="chordPopupList"></div>
        <div class="chord-modal-footer">
            <button class="chord-quick-add-btn" id="quickAddCommonBtn">+ 常用和弦</button>
            <span class="chord-selected-count" id="chordSelectedCount">已选 0</span>
            <button class="chord-batch-add-btn" id="batchAddBtn" disabled>加入练习列表</button>
        </div>
    </div>
</div>
    <!-- 底部详细介绍区域 -->
    <div class="chord-detail-footer" id="chordDetailFooter">
        <div class="detail-title"> 当前和弦详细介绍</div>
        <div class="detail-content" id="chordDetailContent">选一个和弦，这里会显示指法要点和练习建议</div>
    </div>

    <div class="result-modal" id="resultModal">
        <div class="result-modal-card">
            <div class="result-modal-title" id="resultModalTitle">测试提示</div>
            <div class="result-modal-body" id="resultModalBody"></div>
            <div class="result-modal-actions">
                <button class="btn-custom btn-primary" id="resultModalConfirmBtn"><i class="fas fa-check" aria-hidden="true"></i> 我知道了</button>
            </div>
        </div>
    </div>
  
    <!-- MediaPipe（必须阻塞加载，后续 JS 依赖它；camera_utils 未被使用已移除） -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"
        onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js';document.head.appendChild(s);"></script>
    <!-- 本地模块 JS -->
    <script src="/static/js/solo/constants.js?v={{ APP_VERSION }}"></script>
    <script src="/static/js/solo/filters.js?v={{ APP_VERSION }}"></script>
    <script src="/static/js/solo/ui_helpers.js?v={{ APP_VERSION }}"></script>
    <script src="/static/js/lib/meyda.min.js"></script>
    <script src="/static/js/solo/chord_verifier.js?v={{ APP_VERSION }}"></script>
    <script src="/static/js/solo/chord_validator.js?v={{ APP_VERSION }}"></script>
    <script src="/static/js/solo/fingering_detector.js?v={{ APP_VERSION }}"></script>
    <script src="/static/js/solo/camera_manager.js?v={{ APP_VERSION }}"></script>
    <script src="/static/js/solo/socket_manager.js?v={{ APP_VERSION }}"></script>
    <script src="/static/js/solo/main.js?v={{ APP_VERSION }}"></script>

    <!-- 新增：全屏按钮逻辑 -->
    <script>
                // 点击“全屏”按钮：进入视频沉浸模式
        document.getElementById('fullscreenVideoBtn').addEventListener('click', function(e) {
            if (!window.guitarApp || !window.guitarApp.cameraManager || !window.guitarApp.cameraManager.stream) {
                alert('请先开启摄像头');
                return;
            }
            const btn = e.currentTarget;
            const isOverlay = document.body.classList.contains('video-overlay-active');

            if (!isOverlay) {
                // 进入全屏：CSS 叠加层 + 浏览器原生全屏
                document.body.classList.add('video-overlay-active');
                btn.innerHTML = '<i class="fas fa-compress" aria-hidden="true"></i> 退出全屏';
                // 训练中恢复 video-expanded
                if (window.guitarApp && window.guitarApp.testMode && window.guitarApp.elements.videoContainer) {
                    window.guitarApp.elements.videoContainer.classList.add('video-expanded');
                }

                const layout = document.getElementById('trainLayout');
                if (layout) {
                    if (layout.requestFullscreen) {
                        layout.requestFullscreen().catch(() => {});
                    } else if (layout.webkitRequestFullscreen) {
                        layout.webkitRequestFullscreen();
                    } else if (layout.msRequestFullscreen) {
                        layout.msRequestFullscreen();
                    }
                }
            } else {
                // 退出全屏：移除 CSS 叠加层 + 退出浏览器全屏
                document.body.classList.remove('video-overlay-active');
                btn.innerHTML = '<i class="fas fa-expand" aria-hidden="true"></i> 全屏';

                if (document.fullscreenElement) {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    } else if (document.msExitFullscreen) {
                        document.msExitFullscreen();
                    }
                }
            }
            // 重绘指板
            requestAnimationFrame(() => {
                if (window.guitarApp && window.guitarApp.currentChord) {
                    window.guitarApp.renderStandardDots(window.guitarApp.currentChord);
                }
            });
        });


            // ===== 和弦选择模态窗口控制 =====
            (function() {
                const chordModal = document.getElementById('chordModal');
                const chordPopupBtn = document.getElementById('chordPopupBtn');
                const closeBtn = document.getElementById('closeChordModal');
                const searchInput = document.getElementById('chordPopupSearch');
                const catTabs = document.getElementById('chordCatTabs');
                const quickAddBtn = document.getElementById('quickAddCommonBtn');
                const batchAddBtn = document.getElementById('batchAddBtn');
                const recentRow = document.getElementById('chordRecentRow');

                let currentCategory = 'all';
                let selectedChords = [];

                window.getSelectedChords = function() { return selectedChords; };

                function updateSelectedCount() {
                    var countEl = document.getElementById('chordSelectedCount');
                    if (countEl) countEl.textContent = '已选 ' + selectedChords.length;
                    if (batchAddBtn) {
                        batchAddBtn.disabled = selectedChords.length === 0;
                        batchAddBtn.textContent = selectedChords.length > 0
                            ? '加入练习列表(' + selectedChords.length + ')'
                            : '加入练习列表';
                    }
                }

                function updateButtonLabel(name) {
                    document.getElementById('chordPopupLabel').textContent = name || '选择和弦';
                }

                document.getElementById('chordSelect').addEventListener('change', function() {
                    var selected = this.options[this.selectedIndex];
                    updateButtonLabel(selected ? selected.textContent : '');
                });

                function openModal() {
                    chordModal.classList.add('active');
                    // 预选已在测试列表中的和弦（解决外部添加冲突）
                    selectedChords = [];
                    if (window.guitarApp && window.guitarApp.testList) {
                        var chordIds = window.guitarApp.testList;
                        var allChords = window.guitarApp.chords || [];
                        chordIds.forEach(function(id) {
                            var found = allChords.find(function(c) { return c.id === id; });
                            if (found && selectedChords.indexOf(found.name) < 0) {
                                selectedChords.push(found.name);
                            }
                        });
                    }
                    updateSelectedCount();
                    if (window.guitarApp && window.guitarApp.renderPopupList) {
                        window.guitarApp.renderPopupList(searchInput.value, currentCategory);
                    }
                    if (window.guitarApp && window.guitarApp.renderRecentChords) {
                        window.guitarApp.renderRecentChords();
                    }
                }

                chordPopupBtn.addEventListener('click', openModal);

                closeBtn.addEventListener('click', function() {
                    chordModal.classList.remove('active');
                });
                chordModal.addEventListener('click', function(e) {
                    if (e.target === chordModal) chordModal.classList.remove('active');
                });

                searchInput.addEventListener('input', function(e) {
                    if (window.guitarApp && window.guitarApp.renderPopupList) {
                        window.guitarApp.renderPopupList(e.target.value, currentCategory);
                    }
                });

                // 分类标签切换
                if (catTabs) {
                    catTabs.addEventListener('click', function(e) {
                        if (!e.target.classList.contains('chord-cat-tab')) return;
                        catTabs.querySelectorAll('.chord-cat-tab').forEach(function(t) { t.classList.remove('active'); });
                        e.target.classList.add('active');
                        currentCategory = e.target.dataset.cat;
                        if (window.guitarApp && window.guitarApp.renderPopupList) {
                            window.guitarApp.renderPopupList(searchInput.value, currentCategory);
                        }
                    });
                }

                // 一键添加常用和弦
                if (quickAddBtn) {
                    quickAddBtn.addEventListener('click', function() {
                        var commonChords = ['C', 'G', 'Am', 'Em', 'D', 'F'];
                        if (window.guitarApp && window.guitarApp.addChordsToTestList) {
                            window.guitarApp.addChordsToTestList(commonChords);
                        }
                        chordModal.classList.remove('active');
                    });
                }

                // 批量添加选中和弦
                if (batchAddBtn) {
                    batchAddBtn.addEventListener('click', function() {
                        if (selectedChords.length === 0) return;
                        if (window.guitarApp && window.guitarApp.addChordsToTestList) {
                            window.guitarApp.addChordsToTestList(selectedChords);
                        }
                        chordModal.classList.remove('active');
                    });
                }

                // 暴露给 guitarApp 使用
                window.modalToggleChord = function(chordName) {
                    var idx = selectedChords.indexOf(chordName);
                    if (idx >= 0) selectedChords.splice(idx, 1);
                    else selectedChords.push(chordName);
                    updateSelectedCount();
                };
                window.modalIsChordSelected = function(chordName) {
                    return selectedChords.indexOf(chordName) >= 0;
                };
                window.modalGetCategory = function() { return currentCategory; };
                window.modalGetSearchText = function() { return searchInput.value; };

                // 最近使用：点击标签直接选择
                if (recentRow) {
                    recentRow.addEventListener('click', function(e) {
                        var tag = e.target.closest('.chord-recent-tag');
                        if (!tag) return;
                        var chordName = tag.dataset.chord;
                        if (window.guitarApp && window.guitarApp.selectChordByName) {
                            window.guitarApp.selectChordByName(chordName);
                            chordModal.classList.remove('active');
                        }
                    });
                }
            })();

    </script>
    <script defer src="https://cdn.bootcdn.net/ajax/libs/socket.io/4.5.4/socket.io.min.js"></script>
    <!-- 3D 视差倾斜：指板随鼠标微动 -->
</body>
</html>
