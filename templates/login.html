<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 / 注册 - 智能吉他教学</title>
    <link rel="stylesheet" href="https://cdn.staticfile.org/font-awesome/6.0.0-beta3/css/all.min.css">
<script>(function(){var t=localStorage.getItem('theme');if(t==='light')document.documentElement.setAttribute('data-theme','light');})();</script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}?v={{ APP_VERSION }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}?v={{ APP_VERSION }}">
</head>
<body>
    <!-- 粒子背景 -->
    <div id="particles"></div>

    <div class="glass-card">
        <div class="guitar-icon"><i class="fas fa-guitar"></i></div>
        <div class="tabs">
            <button class="tab-btn active" data-tab="login">登 录</button>
            <button class="tab-btn" data-tab="register">注 册</button>
        </div>
        <div class="form-container">
            <form id="login-form" class="form-panel">
                <input type="email" id="login-email" placeholder="邮箱地址" required autocomplete="email">
                <input type="password" id="login-password" placeholder="密码" required autocomplete="current-password">
                <button type="submit">登 录</button>
                <div class="message"></div>
            </form>
            <form id="register-form" class="form-panel" style="display: none;">
                <input type="email" id="reg-email" placeholder="邮箱地址" required autocomplete="email">
                <div class="verify-row">
                    <input type="text" id="reg-verify-code" placeholder="验证码" maxlength="6" required autocomplete="off">
                    <button type="button" id="send-code-btn" class="send-code-btn">发送验证码</button>
                </div>
                <input type="password" id="reg-password" placeholder="密码 (至少6位)" required autocomplete="new-password">
                <input type="password" id="reg-confirm" placeholder="确认密码" required autocomplete="new-password">
                <button type="submit">注 册</button>
                <div class="message"></div>
            </form>
        </div>
        <a href="/" class="back-link">← 返回首页</a>
    </div>

    <script>
        // 金色粒子背景
        (function () {
            var particles = document.getElementById('particles');
            if (!particles) return;
            var count = 40;
            var html = '';
            for (var i = 0; i < count; i++) {
                var size = Math.random() * 4 + 1.5;
                var driftDur = 12 + Math.random() * 14;
                var delay = Math.random() * 8;
                html += '<div class="particle" style="' +
                    'width:' + size + 'px;height:' + size + 'px;' +
                    'left:' + Math.random() * 100 + '%;' +
                    'top:' + Math.random() * 100 + '%;' +
                    'animation-duration:' + driftDur + 's;' +
                    'animation-delay:' + delay + 's;' +
                    'opacity:' + (0.15 + Math.random() * 0.35) + ';' +
                    '"></div>';
            }
            particles.innerHTML = html;
        })();

        // 卡片3D倾斜跟随鼠标
        (function () {
            var card = document.querySelector('.glass-card');
            if (!card) return;
            var maxTilt = 8;
            document.addEventListener('mousemove', function (e) {
                var x = e.clientX / window.innerWidth;
                var y = e.clientY / window.innerHeight;
                var tiltX = (y - 0.5) * maxTilt;
                var tiltY = (x - 0.5) * -maxTilt;
                card.style.transform = 'perspective(1200px) rotateX(' + tiltX.toFixed(1) + 'deg) rotateY(' + tiltY.toFixed(1) + 'deg)';
            });
            card.addEventListener('mouseleave', function () {
                card.style.transform = 'perspective(1200px) rotateX(0deg) rotateY(0deg)';
            });
        })();
    </script>
    <script src="{{ url_for('static', filename='js/login.js') }}?v={{ APP_VERSION }}"></script>
</body>
</html>
