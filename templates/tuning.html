<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>调音器</title>
    <link rel="stylesheet" href="https://cdn.staticfile.org/font-awesome/6.0.0-beta3/css/all.min.css">
<script>(function(){var t=localStorage.getItem('theme');if(!t||t!=='dark')document.documentElement.setAttribute('data-theme','light');})();</script>
    <link rel="stylesheet" href="/static/css/base.css?v={{ APP_VERSION }}">
    <link rel="stylesheet" href="/static/css/tuning.css?v={{ APP_VERSION }}">
</head>
<body>
    <div class="guitar-bg">
        <div class="body"></div>
        <div class="head"></div>
        <div class="soundhole"></div>
        <div class="strings"></div>
    </div>

    <div class="header">
        <div class="auto-mode-btn" id="auto-mode-btn">
            <span class="auto-icon"><i class="fas fa-wand-magic-sparkles" aria-hidden="true"></i></span>
            <span class="auto-text">自动模式</span>
            <span class="auto-status" id="auto-status">关闭</span>
        </div>
        <h2><i class="fas fa-guitar" aria-hidden="true"></i> 调音器</h2>
        <div class="header-actions">
            <button class="back-btn" onclick="window.location.href='/solo'"><i class="fas fa-music" aria-hidden="true"></i> 和弦测试</button>
            <button class="back-btn" onclick="window.location.href='/'"><i class="fas fa-arrow-left" aria-hidden="true"></i> 返回主页</button>
        </div>
    </div>

    <div class="string-select">
        <button class="string-btn active" data-string="6">6弦 (E)</button>
        <button class="string-btn" data-string="5">5弦 (A)</button>
        <button class="string-btn" data-string="4">4弦 (D)</button>
        <button class="string-btn" data-string="3">3弦 (G)</button>
        <button class="string-btn" data-string="2">2弦 (B)</button>
        <button class="string-btn" data-string="1">1弦 (E)</button>
    </div>

    <div class="tuning-progress" id="tuning-progress" style="display:none">
        <div class="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <span class="progress-text" id="progress-text">0/6</span>
    </div>

    <div class="tuning-panel">
        <div class="string-name" id="current-string">6弦 (E)</div>

        <div class="waveform">
            <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
            <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
            <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
            <div class="wave-bar"></div>
        </div>
        <div class="string-vibration" id="vibrate-string">
            <div class="vibrate-string"></div>
        </div>
        <div class="volume-meter">
            <div class="volume-bar" id="volume-bar"></div>
        </div>
        <div class="trend-chart" id="trend-chart"></div>
        <div class="pitch-gauge">
            <div class="pitch-center"></div>
            <div class="pitch-needle" id="pitch-needle"></div>
            <div class="gauge-center-number" id="gauge-center-number">0</div>
        </div>

        <div class="tuning-info" id="deviation">当前偏差：未开始调弦</div>
        <div class="guide-text" id="guide"><i class="fas fa-hand-pointer" aria-hidden="true"></i> 未开始调弦</div>
        <div class="info-note">偏差 ±8 音分以内即可视为音准。</div>

        <button class="start-btn" id="start-tuning">开始调这根弦</button>
    </div>

    <div id="fireworks"></div>

    <script src="https://cdn.bootcdn.net/ajax/libs/socket.io/4.5.4/socket.io.min.js"></script>
    <script src="/static/js/tuning.js?v={{ APP_VERSION }}"></script>
</body>
</html>
