<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>吉他教学 - 智能驾驶舱</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/teach.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        /* 精致小巧的按钮组 */
        .chart-toggle-group {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 10px; /* 缩小 */
        }
        .chart-toggle-btn {
            background: rgba(101, 67, 33, 0.65);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 215, 140, 0.4);
            padding: 5px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            color: #ecd9b4;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            line-height: 1;
        }
        .chart-toggle-btn i {
            font-style: normal;
            font-size: 14px;
        }
        .chart-toggle-btn:hover {
            background: rgba(255, 215, 140, 0.25);
            transform: translateY(-1px);
            border-color: #ffd966;
        }
        .chart-toggle-btn.active {
            background: rgba(255, 215, 140, 0.7);
            color: #2c1a0e;
            border-color: #ffd966;
            box-shadow: 0 0 8px rgba(255, 215, 140, 0.4);
        }

        .right-chart-area {
            min-height: 360px; /* 大幅缩小高度 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 8px; /* 缩小间距 */
        }

        /* 全屏模态框样式 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .modal-container {
            width: 90%;
            max-width: 1200px;
            background: rgba(101, 67, 33, 0.4);
            backdrop-filter: blur(16px);
            border-radius: 36px;
            border: 1px solid rgba(255, 215, 140, 0.5);
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            padding: 20px;
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }
        .modal-overlay.active .modal-container {
            transform: scale(1);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 215, 140, 0.3);
        }
        .modal-header h3 {
            margin: 0;
            color: #ffd966;
            font-size: 1.4rem;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 28px;
            color: #ecd9b4;
            cursor: pointer;
            transition: transform 0.2s;
            line-height: 1;
        }
        .modal-close:hover {
            transform: scale(1.1);
            color: #ffd966;
        }
        .modal-chart-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: rgba(0,0,0,0.2);
            border-radius: 24px;
            overflow: hidden;
        }
        .modal-chart-container .chart-box {
            width: 100%;
            height: 100%;
        }

        /* 推荐列表卡片 - 紧凑样式 */
        .recommend-section {
            width: 100%;
            margin-top: 0; /* 缩小 */
            background: rgba(101, 67, 33, 0.65);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 8px 12px; /* 缩小上下内边距 */
            border: 1px solid rgba(255, 215, 140, 0.3);
        }
        .recommend-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 4px; /* 缩小 */
            padding-bottom: 4px; /* 缩小 */
            border-bottom: 1px solid rgba(255, 215, 140, 0.3);
        }
        .recommend-header h4 {
            margin: 0;
            font-size: 0.95rem;
            color: #ffd966;
        }
        .refresh-recommend {
            background: none;
            border: none;
            color: #ecd9b4;
            cursor: pointer;
            font-size: 0.85rem;
            transition: transform 0.2s;
        }
        .refresh-recommend:hover {
            transform: rotate(180deg);
            color: #ffd966;
        }
        .recommend-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .recommend-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0; /* 缩小 */
            border-bottom: 1px solid rgba(255, 215, 140, 0.2);
        }
        .recommend-item:last-child {
            border-bottom: none;
        }
        .chord-name {
            font-size: 0.95rem;
            font-weight: 600;
            color: #f5e6d3;
        }
        .add-btn {
            background: rgba(255, 215, 140, 0.2);
            border: 1px solid rgba(255, 215, 140, 0.4);
            padding: 3px 10px;
            border-radius: 18px;
            font-size: 0.7rem;
            color: #ecd9b4;
            cursor: pointer;
            transition: all 0.2s;
        }
        .add-btn:hover {
            background: rgba(255, 215, 140, 0.4);
            transform: translateY(-1px);
        }
        .add-btn.added {
            background: rgba(100, 200, 100, 0.3);
            border-color: #6fbf4c;
            color: #6fbf4c;
            cursor: default;
        }
        .add-btn.added:hover {
            transform: none;
        }

        /* ========== 核心：全局超级紧凑布局 ========== */
        .teach-container {
            gap: 12px !important; /* 整体容器间距缩小 */
        }
        .stats-grid {
            margin-bottom: 12px !important; /* 顶部卡片底部间距缩小 */
        }
        .main-grid {
            margin-bottom: 12px !important; /* 主区域底部间距大幅缩小 */
        }
        .advice-section {
            margin-top: 0 !important;
            margin-bottom: 12px !important; /* 智能指导底部间距缩小 */
        }
        .control-panel {
            margin-bottom: 0 !important;
        }
        .recent-records {
            margin-top: 0 !important; /* 记录表格顶部间距缩小 */
        }

        /* 智能指导卡片紧凑 */
        .advice-header {
            margin-bottom: 8px;
        }
        .advice-card {
            padding: 10px 14px;
        }
        .advice-text {
            margin: 0;
            line-height: 1.4;
        }

        /* 表格区域紧凑 */
        .recent-records .section-title {
            margin-top: 0;
            margin-bottom: 8px;
        }
        .table th, .table td {
            padding: 8px 10px; /* 表格行高缩小 */
        }

        @media (max-width: 768px) {
            .modal-container {
                width: 95%;
                padding: 16px;
            }
            .modal-header h3 {
                font-size: 1.2rem;
            }
            .recommend-section {
                padding: 8px 10px;
                margin-top: 0;
            }
            .recommend-item {
                padding: 3px 0;
            }
            .add-btn {
                padding: 2px 8px;
            }
            /* 移动端进一步紧凑 */
            .main-grid {
                margin-bottom: 10px !important;
            }
            .right-chart-area {
                min-height: 320px;
            }
        }
    </style>
</head>
<body>
    <div id="particles"></div>

    <nav class="top-nav">
        <a href="/">首页</a>
        <a href="/tuning">调音器</a>
        <a href="/solo">SOLO模式</a>
        <a href="/history">历史</a>
        <a href="/teach" class="active">教学驾驶舱</a>
    </nav>

    <div class="teach-container">
        <!-- 顶部指标卡片区 -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="total-duration">0</div>
                <div class="stat-label">练习总时长 <span class="unit">(分钟)</span></div>
                <div class="stat-icon">⏱️</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="total-sessions">0</div>
                <div class="stat-label">练习次数</div>
                <div class="stat-icon">🎸</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="avg-accuracy">0</div>
                <div class="stat-label">平均正确率</div>
                <div class="stat-icon">📊</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="weak-chords">—</div>
                <div class="stat-label">薄弱和弦 TOP3</div>
                <div class="stat-icon">⚠️</div>
            </div>
        </div>

        <!-- 主区域：左侧控制区 + 右侧动态图表区（包含按钮和推荐列表） -->
        <div class="main-grid">
            <!-- 左侧控制面板 -->
            <aside class="control-panel">
                <div class="voice-control card">
                    <button id="voice-toggle" class="btn btn-primary">🎤 开启语音遥控</button>
                    <p id="voice-status" class="status-text"></p>
                    <div class="voice-hint">
                        <p>🎙️ 试试说：</p>
                        <ul>
                            <li>“显示掌握度”</li>
                            <li>“显示进步曲线”</li>
                            <li>“朗读指导”</li>
                            <li>“生成新建议”</li>
                            <li>“开始练习 C 和弦”</li>
                        </ul>
                    </div>
                </div>
                <button id="generate-advice-btn" class="btn btn-success btn-block">✨ 生成智能指导</button>
            </aside>

            <!-- 右侧区域：按钮和推荐列表（紧凑布局） -->
            <div class="right-chart-area" id="rightChartArea">
                <div class="chart-toggle-group">
                    <button class="chart-toggle-btn" data-chart="radar">🎯 和弦掌握度</button>
                    <button class="chart-toggle-btn" data-chart="progress">📈 进步趋势</button>
                </div>
                
                <!-- 推荐列表卡片 -->
                <div class="recommend-section">
                    <div class="recommend-header">
                        <h4>✨ AI 推荐练习和弦</h4>
                        <button class="refresh-recommend" id="refreshRecommendBtn" title="换一批">🔄</button>
                    </div>
                    <div class="recommend-list" id="recommendList"></div>
                </div>
            </div>
        </div>

        <!-- 智能指导卡片 -->
        <div class="advice-section card">
            <div class="advice-header">
                <h3>💡 智能指导</h3>
                <button id="speak-advice-btn" class="btn-icon" title="朗读指导">🔊</button>
            </div>
            <div id="advice-card" class="advice-card">
                <p class="advice-text">点击“生成智能指导”获取个性化建议</p>
            </div>
        </div>

        <!-- 最近练习记录 -->
        <section class="recent-records card">
            <h3 class="section-title">📋 最近练习记录</h3>
            <div class="table-wrapper">
                <table class="table" id="records-table">
                    <thead>
                        <tr>
                            <th>时间</th>
                            <th>和弦</th>
                            <th>正确率</th>
                            <th>时长(秒)</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- 模态框结构 -->
    <div id="chartModal" class="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <h3 id="modalTitle">和弦掌握度</h3>
                <button class="modal-close" id="closeModalBtn">&times;</button>
            </div>
            <div id="modalChartContainer" class="modal-chart-container">
                <div id="modalChartBox" class="chart-box"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="/static/js/voice_guide.js"></script>
    <script src="/static/js/teach/charts.js"></script>
    <script src="/static/js/teach/dashboard.js"></script>
</body>
</html>
