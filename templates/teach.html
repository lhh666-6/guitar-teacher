<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>吉他教学 - 智能驾驶舱</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/teach.css">
    <!-- ECharts CDN -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
    <!-- 粒子背景（复用首页效果） -->
    <div id="particles"></div>

    <nav class="top-nav">
        <a href="/">首页</a>
        <a href="/tuning">调音器</a>
        <a href="/solo">SOLO模式</a>
        <a href="/history">历史</a>
        <a href="/teach" class="active">教学驾驶舱</a>
    </nav>

    <div class="teach-container">
        <!-- 左侧面板：用户概览 + 语音控制 -->
        <aside class="teach-left-panel card">
            <div class="user-card">
                <h3>👤 吉他手</h3>
                <p>总练习时长：<span id="total-duration">0</span> 分钟</p>
                <p>总练习次数：<span id="total-sessions">0</span></p>
                <p>平均正确率：<span id="avg-accuracy">0</span>%</p>
                <p>薄弱和弦 TOP3：<span id="weak-chords">—</span></p>
            </div>

            <div class="voice-control">
                <button id="voice-toggle" class="btn btn-primary">🎤 开启语音遥控</button>
                <p id="voice-status" class="status-text"></p>
                <div class="voice-hint">
                    <p>可用指令：</p>
                    <ul>
                        <li>“显示掌握度”</li>
                        <li>“显示进步曲线”</li>
                        <li>“朗读指导”</li>
                        <li>“生成新建议”</li>
                        <li>“开始练习 C 和弦”</li>
                    </ul>
                </div>
            </div>

            <button id="generate-advice-btn" class="btn btn-success" style="width:100%;">✨ 生成智能指导</button>
        </aside>

        <!-- 右侧主内容区：图表 + 指导卡片 + 最近记录 -->
        <main class="teach-main-panel card">
            <!-- 图表选项卡（仅保留两个） -->
            <div class="chart-tabs">
                <button class="tab-btn active" data-chart="mastery">掌握度雷达图</button>
                <button class="tab-btn" data-chart="progress">进步曲线</button>
            </div>

            <!-- 图表容器 -->
            <div id="chart-container"></div>

            <!-- 智能指导卡片区域 -->
            <section class="advice-section">
                <h3 class="section-title">💡 智能指导</h3>
                <div id="advice-card" class="advice-card">
                    <p class="advice-text">点击“生成智能指导”获取个性化建议</p>
                    <button id="speak-advice-btn" class="btn btn-icon">🔊 朗读</button>
                </div>
            </section>

            <!-- 最近练习记录 -->
            <section class="recent-records">
                <h3 class="section-title">📋 最近练习记录</h3>
                <table class="table" id="records-table">
                    <thead>
                        <tr>
                            <th>时间</th>
                            <th>和弦</th>
                            <th>正确率</th>
                            <th>时长(秒)</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </section>
        </main>
    </div>

    <script src="/static/js/voice_guide.js"></script>
    <script src="/static/js/teach/charts.js"></script>
    <script src="/static/js/teach/dashboard.js"></script>
</body>
</html>
