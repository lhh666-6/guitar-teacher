<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>吉他教学 · 智能驾驶舱</title>
    <link rel="dns-prefetch" href="https://cdn.staticfile.org">
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link rel="dns-prefetch" href="https://cdn.socket.io">
    <link rel="preconnect" href="https://cdn.staticfile.org" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://cdn.socket.io" crossorigin>
<script>(function(){var t=localStorage.getItem('theme');if(!t||t!=='dark')document.documentElement.setAttribute('data-theme','light');})();</script>
    <link rel="stylesheet" href="/static/css/base.css?v={{ APP_VERSION }}">
    <link rel="stylesheet" href="/static/css/teach.css?v={{ APP_VERSION }}">
    <link rel="stylesheet" href="https://cdn.staticfile.org/font-awesome/6.0.0-beta3/css/all.min.css">
    <script>// patch passive event listeners to suppress ECharts warnings
    (function(){var o=EventTarget.prototype.addEventListener;EventTarget.prototype.addEventListener=function(t,l,p){var opts=p;if(/mousewheel|touchstart|touchmove|wheel/.test(t)){if(typeof opts==='boolean')opts={capture:opts,passive:true};else if(!opts||opts.passive===undefined){opts=Object.assign({},opts||{},{passive:true})}}o.call(this,t,l,opts)}})();</script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
    <div id="particles"></div>

    <nav class="top-nav">
        <a href="/">首页</a>
        <a href="/tuning">调音器</a>
        <a href="/solo">SOLO模式</a>
        <a href="/history">历史</a>
        <a href="/teach" class="active">教学驾驶舱</a>
    </nav>

    <div class="teach-container">
        <!-- 第一行：统计卡片 -->
        <div class="stats-grid">
            <div class="stat-card" id="card-duration">
                <div class="stat-icon"><i class="fas fa-clock"></i></div>
                <div class="stat-value" id="total-duration">0</div>
                <div class="stat-label">练习总时长 <span class="unit">(分钟)</span></div>
            </div>
            <div class="stat-card" id="card-sessions">
                <div class="stat-icon"><i class="fas fa-dumbbell"></i></div>
                <div class="stat-value" id="total-sessions">0</div>
                <div class="stat-label">练习次数</div>
            </div>
            <div class="stat-card" id="card-accuracy">
                <div class="stat-icon"><i class="fas fa-bullseye"></i></div>
                <div class="stat-value" id="avg-accuracy">0</div>
                <div class="stat-label">平均正确率</div>
            </div>
            <div class="stat-card" id="card-weak">
                <div class="stat-icon"><i class="fas fa-exclamation-triangle"></i></div>
                <div class="stat-value" id="weak-chords">—</div>
                <div class="stat-label">薄弱和弦 TOP3</div>
            </div>
        </div>

        <!-- 第二行：双图表区（带轮播） -->
        <div class="charts-row">
            <div class="chart-panel" id="radarPanel">
                <div class="chart-panel-header">
                    <h3 id="radarPanelTitle">和弦掌握度</h3>
                    <div class="carousel-controls">
                        <button class="carousel-arrow" data-panel="radar" data-dir="prev">◀</button>
                        <span class="carousel-dots" id="radarDots"></span>
                        <button class="carousel-arrow" data-panel="radar" data-dir="next">▶</button>
                    </div>
                </div>
                <div class="chart-box active" id="radarChartBox"></div>
                <div class="chart-empty" id="radarEmpty">暂无练习数据</div>
            </div>
            <div class="chart-panel" id="progressPanel">
                <div class="chart-panel-header">
                    <h3 id="progressPanelTitle">进步趋势</h3>
                    <div class="carousel-controls">
                        <button class="carousel-arrow" data-panel="progress" data-dir="prev">◀</button>
                        <span class="carousel-dots" id="progressDots"></span>
                        <button class="carousel-arrow" data-panel="progress" data-dir="next">▶</button>
                    </div>
                </div>
                <div class="chart-box active" id="progressChartBox"></div>
                <div class="chart-empty" id="progressEmpty">暂无趋势数据</div>
            </div>
        </div>

        <!-- 第三行：稳定度统计 + 模式使用比例 -->
        <div class="mini-stats-row">
            <div class="mini-stat-card">
                <span class="mini-stat-label">不稳次数</span>
                <span class="mini-stat-value" id="unstable-count">0</span>
            </div>
            <div class="mini-stat-card">
                <span class="mini-stat-label">不稳占比</span>
                <span class="mini-stat-value" id="unstable-ratio">0%</span>
            </div>
            <div class="mini-stat-card mode-stat-card">
                <span class="mini-stat-label">快速模式</span>
                <span class="mini-stat-value" id="quick-mode-count">0</span>
                <span class="mini-stat-sub" id="quick-mode-pct">0%</span>
            </div>
            <div class="mini-stat-card mode-stat-card">
                <span class="mini-stat-label">普通模式</span>
                <span class="mini-stat-value" id="normal-mode-count">0</span>
                <span class="mini-stat-sub" id="normal-mode-pct">0%</span>
            </div>
            <div class="mini-stat-card donut-card">
                <div class="donut-box" id="stabilityDonut"></div>
            </div>
        </div>

        <!-- 第四行：AI 推荐练习和弦 -->
        <div class="recommend-section">
            <div class="section-header">
                <h3>AI 推荐练习和弦</h3>
                <button class="refresh-btn" id="refreshRecommendBtn">换一批</button>
            </div>
            <div class="recommend-list" id="recommendList"></div>
        </div>

        <!-- 第五行：智能指导 + 最近记录（双栏） -->
        <div class="bottom-row">
            <div class="advice-section">
                <div class="section-header">
                    <h3>智能指导</h3>
                    <div class="section-header-actions">
                        <button id="speak-advice-btn" class="mini-btn">朗读</button>
                        <button id="generate-advice-btn" class="mini-btn primary">生成指导</button>
                    </div>
                </div>
                <div class="advice-content">
                    <div id="adviceLoadingContainer" class="loading-container hidden">
                        <div class="loading-spinner"></div>
                        <span id="bubbleMessage" class="loading-text">正在分析数据...</span>
                    </div>
                    <p id="adviceTextDisplay" class="advice-text">点击「生成指导」获取全面学习评估报告</p>
                </div>
            </div>
            <div class="records-section">
                <div class="section-header">
                    <h3>最近练习记录</h3>
                </div>
                <div class="table-wrapper">
                    <table class="table" id="records-table">
                        <thead>
                            <tr>
                                <th>时间</th>
                                <th>和弦</th>
                                <th>正确率</th>
                                <th>时长(秒)</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script defer src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="/static/js/teach/charts.js?v={{ APP_VERSION }}"></script>
    <script src="/static/js/teach/dashboard.js?v={{ APP_VERSION }}"></script>
    <script>
        (function() {
            var container = document.getElementById('particles');
            if (!container) return;
            var fragment = document.createDocumentFragment();
            for (var i = 0; i < 22; i++) {
                var p = document.createElement('div');
                p.className = 'particle';
                var size = Math.random() * 90 + 30;
                p.style.cssText =
                    'width:' + size + 'px;height:' + size + 'px;' +
                    'left:' + Math.random()*100 + '%;top:' + Math.random()*100 + '%;' +
                    'animation-delay:' + Math.random()*8 + 's;' +
                    'animation-duration:' + (14 + Math.random()*12) + 's;' +
                    'opacity:' + (0.05 + Math.random()*0.1) + ';';
                fragment.appendChild(p);
            }
            container.appendChild(fragment);
        })();
    </script>
</html>
