<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>训练历史 - 智能吉他教学系统</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #f9f3e7 0%, #e8dccc 100%);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255,248,235,0.95);
            border-radius: 32px;
            padding: 20px 30px 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 30px;
            border-bottom: 2px solid #d9b48b;
            padding-bottom: 15px;
        }
        h1 {
            margin: 0;
            font-size: 2rem;
            background: linear-gradient(135deg, #7a4d2e, #b87a4b);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }
        .back-link {
            background: #8b5a2b;
            color: white;
            text-decoration: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 500;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .back-link:hover {
            background: #5a3a1a;
            transform: translateY(-2px);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: white;
            border-radius: 28px;
            padding: 20px;
            border-left: 8px solid #d9b48b;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .stat-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #b87a4b;
            margin-bottom: 12px;
            font-weight: 600;
        }
        .stat-number {
            font-size: 2.5rem;
            font-weight: 800;
            color: #5a3e2b;
            line-height: 1;
        }
        .stat-unit {
            font-size: 0.9rem;
            font-weight: normal;
            color: #9b7a5c;
        }
        .chart-filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            margin-bottom: 40px;
        }
        .chart-box {
            flex: 2;
            background: #fffef7;
            border-radius: 24px;
            padding: 15px;
        }
        .filters-box {
            flex: 1;
            background: #fffef7;
            border-radius: 24px;
            padding: 20px;
        }
        .filter-group {
            margin-bottom: 20px;
        }
        .filter-group label {
            display: block;
            font-weight: 600;
            color: #7a4d2e;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        select, input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e2cfb3;
            border-radius: 30px;
            font-size: 0.9rem;
            background: white;
            transition: 0.2s;
        }
        select:focus, input:focus {
            outline: none;
            border-color: #b87a4b;
            box-shadow: 0 0 0 3px rgba(184,122,75,0.2);
        }
        .btn-reset {
            background: #e9dbcf;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
            color: #5a3e2b;
            width: 100%;
            transition: background 0.2s;
        }
        .btn-reset:hover {
            background: #d9b48b;
            color: white;
        }
        /* 虚拟滚动容器 */
        .virtual-scroll-container {
            height: 500px;
            overflow-y: auto;
            background: white;
            border-radius: 24px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            position: relative;
        }
        .virtual-scroll-content {
            position: relative;
            width: 100%;
        }
        .table-row {
            display: flex;
            border-bottom: 1px solid #f0e5d8;
            font-size: 0.9rem;
        }
        .header-row {
            background: #f1e7dc;
            font-weight: 700;
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 2px solid #d9b48b;
        }
        .table-cell {
            padding: 12px;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .col-id { width: 8%; }
        .col-chord { width: 15%; }
        .col-result { width: 20%; }
        .col-time { width: 15%; }
        .col-date { width: 42%; }
        .badge-correct, .badge-wrong {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .badge-correct { background: #c8e6d9; color: #2e6b47; }
        .badge-wrong { background: #ffe0db; color: #c25d3a; }
        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
        }
        .page-btn {
            background: #f1e7dc;
            border: none;
            padding: 8px 14px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }
        .page-btn.active {
            background: #b87a4b;
            color: white;
        }
        .page-btn:hover:not(.active) {
            background: #d9b48b;
            color: white;
        }
        .empty-row {
            text-align: center;
            padding: 40px;
            color: #9b7a5c;
        }
        @media (max-width: 680px) {
            .container { padding: 15px; }
            .stat-number { font-size: 1.8rem; }
            .table-cell { padding: 8px 4px; font-size: 0.75rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-chart-line"></i> 训练历史</h1>
        <a href="/" class="back-link"><i class="fas fa-home"></i> 返回首页</a>
    </div>

    <!-- 统计卡片 -->
    <div class="stats-grid" id="statsContainer">
        <div class="stat-card"><div class="stat-title">总练习次数</div><div class="stat-number" id="totalCount">-</div></div>
        <div class="stat-card"><div class="stat-title">总体正确率</div><div class="stat-number" id="totalAccuracy">-<span class="stat-unit">%</span></div></div>
        <div class="stat-card"><div class="stat-title">最近练习</div><div class="stat-number" id="lastPractice" style="font-size:1.2rem;">-</div></div>
        <div class="stat-card"><div class="stat-title">薄弱和弦</div><div class="stat-number" id="weakChords" style="font-size:1.1rem;">-</div></div>
    </div>

    <div class="chart-filter-row">
        <div class="chart-box">
            <div id="chartContainer" style="height: 320px; width: 100%;"></div>
        </div>
        <div class="filters-box">
            <h3 style="margin-top:0; color:#7a4d2e;"><i class="fas fa-filter"></i> 筛选记录</h3>
            <div class="filter-group">
                <label><i class="fas fa-guitar"></i> 和弦</label>
                <select id="filterChord">
                    <option value="all">全部和弦</option>
                </select>
            </div>
            <div class="filter-group">
                <label><i class="fas fa-check-circle"></i> 结果</label>
                <select id="filterResult">
                    <option value="all">全部</option>
                    <option value="correct">✓ 正确</option>
                    <option value="wrong">✗ 错误</option>
                </select>
            </div>
            <div class="filter-group">
                <label><i class="fas fa-calendar-alt"></i> 日期范围</label>
                <input type="date" id="startDate">
                <input type="date" id="endDate" style="margin-top: 8px;">
            </div>
            <button class="btn-reset" id="resetFilters"><i class="fas fa-undo-alt"></i> 重置筛选</button>
        </div>
    </div>

    <!-- 虚拟滚动表格 -->
    <div id="virtualScrollContainer" class="virtual-scroll-container">
        <div id="virtualScrollContent" class="virtual-scroll-content">
            <div class="table-row header-row">
                <div class="table-cell col-id">#</div>
                <div class="table-cell col-chord">和弦</div>
                <div class="table-cell col-result">结果</div>
                <div class="table-cell col-time">用时(秒)</div>
                <div class="table-cell col-date">练习时间</div>
            </div>
        </div>
    </div>

    <div id="paginationControls" class="pagination"></div>
</div>

<script>
    // 筛选条件
    let filters = { chord: 'all', result: 'all', startDate: '', endDate: '' };
    let currentPage = 1;
    let totalPages = 1;
    let allRecords = [];
    const ROW_HEIGHT = 52;
    let container = document.getElementById('virtualScrollContainer');
    let content = document.getElementById('virtualScrollContent');
    let scrollHandler = null;
    let resizeObserver = null;

    // 虚拟滚动核心
    function renderVisibleRows() {
        const scrollTop = container.scrollTop;
        const visibleHeight = container.clientHeight;
        const startIndex = Math.floor(scrollTop / ROW_HEIGHT);
        const endIndex = Math.min(startIndex + Math.ceil(visibleHeight / ROW_HEIGHT) + 1, allRecords.length);
        // 移除所有非表头行
        const rows = content.querySelectorAll('.table-row:not(.header-row)');
        rows.forEach(row => row.remove());

        for (let i = startIndex; i < endIndex; i++) {
            const rec = allRecords[i];
            const row = document.createElement('div');
            row.className = 'table-row';
            row.style.position = 'absolute';
            row.style.top = (i * ROW_HEIGHT) + 'px';
            row.style.width = '100%';
            row.innerHTML = `
                <div class="table-cell col-id">${(currentPage-1)*10 + i + 1}</div>
                <div class="table-cell col-chord"><strong>${escapeHtml(rec.chord_name)}</strong></div>
                <div class="table-cell col-result">${rec.correct ? '<span class="badge-correct"><i class="fas fa-check"></i> 正确</span>' : '<span class="badge-wrong"><i class="fas fa-times"></i> 错误</span>'}</div>
                <div class="table-cell col-time">${rec.time_spent ? rec.time_spent.toFixed(2) : '--'}</div>
                <div class="table-cell col-date">${formatDate(rec.created_at)}</div>
            `;
            content.appendChild(row);
        }
    }

    function formatDate(isoString) {
        if (!isoString) return '';
        try {
            return new Date(isoString).toLocaleString();
        } catch(e) { return isoString; }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function setupVirtualScroll(records) {
        allRecords = records;
        const totalHeight = records.length * ROW_HEIGHT;
        content.style.height = totalHeight + 'px';
        renderVisibleRows();
        if (scrollHandler) container.removeEventListener('scroll', scrollHandler);
        scrollHandler = () => requestAnimationFrame(renderVisibleRows);
        container.addEventListener('scroll', scrollHandler);
        if (resizeObserver) resizeObserver.disconnect();
        resizeObserver = new ResizeObserver(() => renderVisibleRows());
        resizeObserver.observe(container);
    }

    // 加载统计数据
    async function loadStats() {
        try {
            const res = await fetch('/api/history/stats');
            const stats = await res.json();
            document.getElementById('totalCount').innerText = stats.total_count;
            document.getElementById('totalAccuracy').innerHTML = stats.accuracy.toFixed(1) + '<span class="stat-unit">%</span>';
            document.getElementById('lastPractice').innerHTML = stats.last_practice ? new Date(stats.last_practice).toLocaleString() : '无记录';
            document.getElementById('weakChords').innerHTML = stats.weak_chords.length ? stats.weak_chords.join(', ') : '暂无';
            // 填充和弦下拉框
            const chordSelect = document.getElementById('filterChord');
            chordSelect.innerHTML = '<option value="all">全部和弦</option>' + 
                stats.chords.map(ch => `<option value="${ch}">${ch}</option>`).join('');
            // 懒加载图表
            if (stats.chords.length) {
                renderChartLater(stats.chords, stats.accuracies);
            } else {
                document.getElementById('chartContainer').innerHTML = '<div style="text-align:center; padding-top:120px;">暂无练习数据</div>';
            }
        } catch (err) {
            console.error('加载统计数据失败', err);
        }
    }

    let chartRendered = false;
    function renderChartLater(chords, accuracies) {
        if (chartRendered) return;
        const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting) {
                renderChart(chords, accuracies);
                observer.disconnect();
                chartRendered = true;
            }
        });
        observer.observe(document.getElementById('chartContainer'));
    }

    function renderChart(chords, accuracies) {
        const chartDom = document.getElementById('chartContainer');
        const myChart = echarts.init(chartDom);
        myChart.setOption({
            tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
            xAxis: { type: 'category', data: chords, axisLabel: { rotate: 30 } },
            yAxis: { type: 'value', name: '正确率 (%)', max: 100 },
            series: [{
                name: '正确率',
                type: 'bar',
                data: accuracies,
                itemStyle: { borderRadius: [8,8,0,0], color: '#b87a4b' },
                label: { show: true, position: 'top', formatter: '{c}%' }
            }],
            grid: { containLabel: true, top: 20, bottom: 20 }
        });
        window.addEventListener('resize', () => myChart.resize());
    }

    // 加载表格数据
    async function loadTable(page = 1) {
        currentPage = page;
        const params = new URLSearchParams({
            page: page,
            per_page: 10,
            chord: filters.chord !== 'all' ? filters.chord : '',
            result: filters.result !== 'all' ? filters.result : '',
            start_date: filters.startDate,
            end_date: filters.endDate
        });
        try {
            const res = await fetch(`/api/history/data?${params}`);
            const data = await res.json();
            setupVirtualScroll(data.records);
            totalPages = Math.ceil(data.total / data.per_page);
            renderPagination();
        } catch (err) {
            console.error('加载表格数据失败', err);
            content.innerHTML += '<div class="empty-row">加载失败，请重试</div>';
        }
    }

    function renderPagination() {
        const container = document.getElementById('paginationControls');
        if (totalPages <= 1) {
            container.innerHTML = '';
            return;
        }
        let btns = '';
        for (let i = 1; i <= totalPages; i++) {
            btns += `<button class="page-btn ${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</button>`;
        }
        container.innerHTML = btns;
        document.querySelectorAll('.page-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const page = parseInt(btn.dataset.page);
                if (!isNaN(page) && page !== currentPage) loadTable(page);
            });
        });
    }

    function bindFilters() {
        const chordSelect = document.getElementById('filterChord');
        const resultSelect = document.getElementById('filterResult');
        const startDate = document.getElementById('startDate');
        const endDate = document.getElementById('endDate');
        const resetBtn = document.getElementById('resetFilters');
        const update = () => {
            filters.chord = chordSelect.value;
            filters.result = resultSelect.value;
            filters.startDate = startDate.value;
            filters.endDate = endDate.value;
            loadTable(1);
        };
        chordSelect.addEventListener('change', update);
        resultSelect.addEventListener('change', update);
        startDate.addEventListener('change', update);
        endDate.addEventListener('change', update);
        resetBtn.addEventListener('click', () => {
            chordSelect.value = 'all';
            resultSelect.value = 'all';
            startDate.value = '';
            endDate.value = '';
            update();
        });
    }

    async function init() {
        await loadStats();
        bindFilters();
        await loadTable(1);
    }
    init();
</script>
</body>
</html>
