<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>练习记录</title>
    <link rel="dns-prefetch" href="https://cdn.bootcdn.net">
    <link rel="dns-prefetch" href="https://cdn.staticfile.org">
    <link rel="dns-prefetch" href="https://cdn.socket.io">
    <link rel="preconnect" href="https://cdn.bootcdn.net" crossorigin>
    <link rel="preconnect" href="https://cdn.staticfile.org" crossorigin>
    <link rel="preconnect" href="https://cdn.socket.io" crossorigin>
    <script>// patch passive event listeners to suppress ECharts warnings
    (function(){var o=EventTarget.prototype.addEventListener;EventTarget.prototype.addEventListener=function(t,l,p){var opts=p;if(/mousewheel|touchstart|touchmove|wheel/.test(t)){if(typeof opts==='boolean')opts={capture:opts,passive:true};else if(!opts||opts.passive===undefined){opts=Object.assign({},opts||{},{passive:true})}}o.call(this,t,l,opts)}})();</script>
    <script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
    <link rel="stylesheet" href="https://cdn.staticfile.org/font-awesome/6.0.0-beta3/css/all.min.css">
<script>(function(){var t=localStorage.getItem('theme');if(!t||t!=='dark')document.documentElement.setAttribute('data-theme','light');})();</script>
    <link rel="stylesheet" href="/static/css/base.css?v={{ APP_VERSION }}">
    <link rel="stylesheet" href="/static/css/history.css?v={{ APP_VERSION }}">
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-chart-line"></i> 训练历史</h1>
        <div style="display:flex;gap:12px;align-items:center;">
            <button id="clearHistoryBtn" class="back-link" style="background:rgba(220,53,69,0.2);border-color:rgba(220,53,69,0.4);color:#ff6b7a;cursor:pointer;">
                <i class="fas fa-trash-alt"></i> 清空记录
            </button>
            <a href="/" class="back-link"><i class="fas fa-home"></i> 返回首页</a>
        </div>
    </div>

    <!-- 第一行统计卡片 -->
    <div class="stats-grid" id="statsContainer">
        <div class="stat-card">
            <div class="stat-title">总练习次数</div>
            <div class="stat-number" id="totalCount">-</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">总体正确率</div>
            <div class="stat-number" id="totalAccuracy">-<span class="stat-unit">%</span></div>
        </div>
        <div class="stat-card">
            <div class="stat-title">最近练习</div>
            <div class="stat-number" id="lastPractice" style="font-size:1.2rem;">-</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">薄弱和弦</div>
            <div class="stat-number" id="weakChords" style="font-size:1.1rem;">-</div>
        </div>
    </div>

    <!-- 第二行统计卡片 -->
    <div class="stats-grid" style="grid-template-columns: repeat(3, 1fr);">
        <div class="stat-card">
            <div class="stat-title">按弦不稳次数</div>
            <div class="stat-number" id="unstable-count">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">不稳比例</div>
            <div class="stat-number" id="unstable-ratio">0%</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">最近练习模式</div>
            <div class="stat-number" id="practice-mode" style="font-size:1.2rem;">-</div>
        </div>
    </div>

    <!-- 图表与筛选区域 -->
    <div class="chart-filter-row">
        <div class="chart-box">
            <div id="chartContainer"></div>
        </div>
        <div class="filters-box">
            <h3><i class="fas fa-filter"></i> 筛选记录</h3>
            <div class="filter-group">
                <label><i class="fas fa-guitar"></i> 和弦</label>
                <select id="filterChord"><option value="all">全部和弦</option></select>
            </div>
            <div class="filter-group">
                <label><i class="fas fa-check-circle"></i> 结果</label>
                <select id="filterResult">
                    <option value="all">全部</option>
                    <option value="correct">✓ 正确</option>
                    <option value="wrong">✗ 错误</option>
                </select>
            </div>
            <div class="filter-group">
                <label><i class="fas fa-calendar-alt"></i> 日期范围</label>
                <input type="date" id="startDate">
                <input type="date" id="endDate">
            </div>
            <button class="btn-reset" id="resetFilters"><i class="fas fa-undo-alt"></i> 重置筛选</button>
        </div>
    </div>

    <!-- 分页表格 -->
    <div class="table-section">
        <table>
            <thead>
                <tr>
                    <th style="width:5%">#</th>
                    <th style="width:12%">和弦</th>
                    <th style="width:10%">结果</th>
                    <th style="width:10%">状态</th>
                    <th style="width:8%">用时(s)</th>
                    <th style="width:10%">模式</th>
                    <th>练习时间</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="7" style="text-align:center;padding:40px;color:#c0a88b;">加载中...</td></tr>
            </tbody>
        </table>
    </div>

    <div id="paginationControls" class="pagination"></div>
</div>

<script>
(function() {
    var filters = { chord: 'all', result: 'all', startDate: '', endDate: '' };
    var currentPage = 1;
    var totalPages = 1;
    var totalRecords = 0;
    var PER_PAGE = 10;
    var chartInstance = null;

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            return ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m];
        });
    }

    function formatDate(iso) {
        if (!iso) return '--';
        try { return new Date(iso).toLocaleString(); } catch(e) { return iso; }
    }

    // ========== 加载统计 ==========
    function loadStats() {
        return fetch('/api/history/stats')
            .then(function(res) { return res.json(); })
            .then(function(stats) {
                document.getElementById('totalCount').textContent = stats.total_count || 0;
                var acc = parseFloat(stats.accuracy) || 0;
                document.getElementById('totalAccuracy').innerHTML = acc.toFixed(1) + '<span class="stat-unit">%</span>';
                document.getElementById('lastPractice').textContent = stats.last_practice ? new Date(stats.last_practice).toLocaleString() : '无记录';
                var weak = stats.weak_chords || [];
                document.getElementById('weakChords').textContent = weak.length ? weak.join(', ') : '暂无';

                var sel = document.getElementById('filterChord');
                var list = stats.chords || [];
                sel.innerHTML = '<option value="all">全部和弦</option>' + list.map(function(c) { return '<option value="' + c + '">' + c + '</option>'; }).join('');

                if (stats.unstable_count !== undefined) {
                    document.getElementById('unstable-count').textContent = stats.unstable_count || 0;
                }
                if (stats.unstable_ratio !== undefined) {
                    document.getElementById('unstable-ratio').textContent = (stats.unstable_ratio || 0).toFixed(1) + '%';
                }
                if (stats.latest_mode) {
                    document.getElementById('practice-mode').textContent = stats.latest_mode === 'quick' ? '快速模式' : '普通模式';
                }

                if (list.length) renderChart(list, stats.accuracies || []);
                else document.getElementById('chartContainer').innerHTML = '<div style="text-align:center;padding-top:120px;color:#c0a88b;">暂无练习数据</div>';
            })
            .catch(function(err) { console.error('加载统计失败', err); });
    }

    // ========== 图表 ==========
    function renderChart(chords, accuracies) {
        var dom = document.getElementById('chartContainer');
        if (chartInstance) chartInstance.dispose();
        // 等待容器有尺寸
        if (dom.clientWidth === 0 || dom.clientHeight === 0) {
            requestAnimationFrame(function() { renderChart(chords, accuracies); });
            return;
        }
        chartInstance = echarts.init(dom);
        var safe = (accuracies || []).map(function(v) { return parseFloat(v) || 0; });
        var isLight = document.documentElement.getAttribute('data-theme') === 'light';
        var t = {
            tooltipBg: isLight ? 'rgba(255,250,242,0.95)' : 'rgba(30,20,15,0.95)',
            tooltipBorder: isLight ? 'rgba(180,130,80,0.4)' : 'rgba(255,215,140,0.4)',
            tooltipText: isLight ? '#3d2e1e' : '#ecd9b4',
            axisLabel: isLight ? '#6b5040' : '#c0a88b',
            axisLine: isLight ? 'rgba(180,130,80,0.2)' : 'rgba(255,215,140,0.15)',
            splitLine: isLight ? 'rgba(180,130,80,0.08)' : 'rgba(255,215,140,0.06)',
            barTop: isLight ? '#8b5820' : '#ffd966',
            barBot: isLight ? '#c0a070' : '#c0a070'
        };
        chartInstance.setOption({
            tooltip: {
                trigger: 'axis', axisPointer: { type: 'shadow' },
                backgroundColor: t.tooltipBg, borderColor: t.tooltipBorder,
                textStyle: { color: t.tooltipText, fontSize: 13 }
            },
            xAxis: {
                type: 'category', data: chords,
                axisLabel: { rotate: 30, color: t.axisLabel, fontSize: 11 },
                axisLine: { lineStyle: { color: t.axisLine } },
                axisTick: { show: false }
            },
            yAxis: {
                type: 'value', name: '正确率 (%)', max: 100,
                nameTextStyle: { color: t.axisLabel, fontSize: 11 },
                axisLabel: { color: t.axisLabel, fontSize: 10 },
                splitLine: { lineStyle: { color: t.splitLine } }
            },
            series: [{
                type: 'bar', data: safe,
                itemStyle: {
                    borderRadius: [8,8,0,0],
                    color: new echarts.graphic.LinearGradient(0,0,0,1, [
                        {offset:0,color: t.barTop},{offset:1,color: t.barBot}
                    ])
                },
                label: { show: true, position: 'top', formatter: '{c}%', color: t.axisLabel, fontSize: 11 },
                emphasis: { itemStyle: { shadowBlur: 10, shadowColor: 'rgba(255,217,102,0.3)' } }
            }],
            grid: { containLabel: true, left: '8%', right: '4%', top: 45, bottom: 20 }
        });
        window.addEventListener('resize', function() { if (chartInstance) chartInstance.resize(); });
    }

    // ========== 分页表格 ==========
    function loadTable(page) {
        currentPage = page;
        var params = new URLSearchParams({
            page: page, per_page: PER_PAGE,
            chord: filters.chord !== 'all' ? filters.chord : '',
            result: filters.result !== 'all' ? filters.result : '',
            start_date: filters.startDate, end_date: filters.endDate
        });
        return fetch('/api/history/data?' + params)
            .then(function(res) { return res.json(); })
            .then(function(data) {
                var records = data.records || [];
                totalRecords = data.total || 0;
                totalPages = Math.ceil(totalRecords / (data.per_page || PER_PAGE)) || 1;
                renderTable(records);
                renderPagination();
            })
            .catch(function(err) {
                console.error('加载表格失败', err);
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;color:#e74c3c;">加载失败，请重试</td></tr>';
            });
    }

    function renderTable(records) {
        var tbody = document.getElementById('tableBody');
        var startNum = (currentPage - 1) * PER_PAGE;
        if (!records.length) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;color:#c0a88b;">暂无匹配记录</td></tr>';
            return;
        }
        tbody.innerHTML = records.map(function(r, i) {
            var correct = r.correct;
            return '<tr class="page-enter" style="animation-delay:' + (i * 0.04) + 's">' +
                '<td>' + (startNum + i + 1) + '</td>' +
                '<td><strong>' + escapeHtml(r.chord_name) + '</strong></td>' +
                '<td>' + (correct ? '<span class="badge-correct">✓ 正确</span>' : '<span class="badge-wrong">✗ 错误</span>') + '</td>' +
                '<td>' +
                    (r.is_unstable ? '<i class="fas fa-exclamation-triangle" style="color:#e6a817;" title="按弦不稳"></i>' : '—') +
                    (r.similarity != null ? ' <span style="margin-left:4px;font-size:0.78rem;">' + parseFloat(r.similarity).toFixed(2) + '</span>' : '') +
                '</td>' +
                '<td>' + (r.time_spent != null ? r.time_spent.toFixed(2) : '--') + '</td>' +
                '<td>' + (r.mode === 'quick' ? '<span class="badge-mode badge-quick">快速</span>' : '<span class="badge-mode">普通</span>') + '</td>' +
                '<td>' + formatDate(r.created_at) + '</td>' +
                '</tr>';
        }).join('');
    }

    function renderPagination() {
        var pag = document.getElementById('paginationControls');
        if (totalPages <= 1) { pag.innerHTML = ''; return; }

        var html = '<button class="page-btn" data-page="' + (currentPage - 1) + '"' + (currentPage <= 1 ? ' disabled' : '') + '>◀</button>';

        var start = Math.max(1, currentPage - 2);
        var end = Math.min(totalPages, currentPage + 2);

        if (start > 1) { html += '<button class="page-btn" data-page="1">1</button>'; }
        if (start > 2) { html += '<span class="page-info">…</span>'; }

        for (var i = start; i <= end; i++) {
            html += '<button class="page-btn' + (i === currentPage ? ' active' : '') + '" data-page="' + i + '">' + i + '</button>';
        }

        if (end < totalPages - 1) { html += '<span class="page-info">…</span>'; }
        if (end < totalPages) { html += '<button class="page-btn" data-page="' + totalPages + '">' + totalPages + '</button>'; }

        html += '<button class="page-btn" data-page="' + (currentPage + 1) + '"' + (currentPage >= totalPages ? ' disabled' : '') + '>▶</button>';

        html += '<span class="page-info">共 ' + totalRecords + ' 条</span>';
        pag.innerHTML = html;

        pag.querySelectorAll('.page-btn:not([disabled])').forEach(function(btn) {
            btn.addEventListener('click', function() {
                var p = parseInt(btn.dataset.page);
                if (p >= 1 && p <= totalPages && p !== currentPage) loadTable(p);
            });
        });
    }

    // ========== 筛选绑定 ==========
    function bindFilters() {
        var chordSel = document.getElementById('filterChord');
        var resultSel = document.getElementById('filterResult');
        var startEl = document.getElementById('startDate');
        var endEl = document.getElementById('endDate');

        function update() {
            filters.chord = chordSel.value;
            filters.result = resultSel.value;
            filters.startDate = startEl.value;
            filters.endDate = endEl.value;
            loadTable(1);
        }
        chordSel.addEventListener('change', update);
        resultSel.addEventListener('change', update);
        startEl.addEventListener('change', update);
        endEl.addEventListener('change', update);
        document.getElementById('resetFilters').addEventListener('click', function() {
            chordSel.value = 'all'; resultSel.value = 'all';
            startEl.value = ''; endEl.value = '';
            update();
        });
    }

    // ========== 清空记录 ==========
    document.getElementById('clearHistoryBtn').addEventListener('click', function() {
        if (!confirm('确定要清空所有练习记录吗？此操作不可撤销。')) return;
        fetch('/api/history/clear', { method: 'POST' })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                alert(data.message || '已清空');
                loadStats().then(function() { loadTable(1); });
            })
            .catch(function(err) { alert('清空失败: ' + err.message); });
    });

    // ========== 启动 ==========
    loadStats().then(function() {
        bindFilters();
        return loadTable(1);
    });
})();
</script>
<script defer src="https://cdn.bootcdn.net/ajax/libs/socket.io/4.5.4/socket.io.min.js"></script>
</body>
</html>
