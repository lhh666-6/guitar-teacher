<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>智能吉他教学系统 · 音乐家风格 · 动效优化版</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- ✅ 国内镜像：GSAP (BootCDN) -->
    <script src="https://cdn.bootcdn.net/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
        /* ========== 全局样式 & 动效优化 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', 'Georgia', serif;
            min-height: 100vh;
            background: #1a120b;
            color: #fff;
            overflow-x: hidden;
            position: relative;
            will-change: scroll-position;  /* 滚动性能优化 */
        }

        /* 减少动效偏好适配 */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
            .intro-overlay,
            .intro-content img,
            .intro-hint,
            .mode-card,
            .nav-btn,
            .title,
            #particles-js canvas {
                animation: none !important;
                transition: none !important;
                transform: none !important;
            }
            .intro-overlay {
                display: none !important;
            }
            .main-content {
                opacity: 1 !important;
                visibility: visible !important;
            }
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                repeating-linear-gradient(45deg, rgba(100, 60, 20, 0.15) 0px, rgba(100, 60, 20, 0.15) 2px, transparent 2px, transparent 8px),
                linear-gradient(to bottom, transparent 90%, rgba(200, 140, 60, 0.2) 90%),
                linear-gradient(to right, transparent 90%, rgba(200, 140, 60, 0.2) 90%);
            background-size: 20px 20px, 100% 20px, 20px 100%;
            pointer-events: none;
            z-index: 0;
            will-change: transform;  /* 优化背景合成 */
        }

        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(transparent, transparent 16.66%, rgba(210, 180, 140, 0.15) 16.66%, rgba(210, 180, 140, 0.15) 16.76%);
            pointer-events: none;
            z-index: 0;
        }

        #particles-js {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: block;
            pointer-events: none;
        }

        #particles-js canvas {
            will-change: transform;
            backface-visibility: hidden;
        }

        /* 公用按钮样式 */
        .nav-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(30, 20, 15, 0.65);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(220, 160, 80, 0.5);
            border-radius: 40px;
            color: #ecd9b4;
            font-size: 16px;
            font-weight: 500;
            text-decoration: none;
            transition: transform 0.2s cubic-bezier(0.2,0.9,0.4,1), 
                        box-shadow 0.2s ease, 
                        background 0.25s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            will-change: transform;
            backface-visibility: hidden;
        }

        .nav-btn:hover {
            background: rgba(50, 35, 25, 0.8);
            border-color: #e3a72e;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(200, 130, 30, 0.4);
        }

        .nav-btn:active {
            transform: translateY(1px);
            transition-duration: 0.05s;
        }

        /* 左上角按钮 */
        .top-left-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
        }

        /* 右上角按钮 */
        .top-right-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
        }

        .title {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            background: linear-gradient(135deg, #f4c542, #e3a72e, #c6861f);
            -webkit-background-clip: text;
            background-clip: text; 
            color: transparent;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(230, 150, 30, 0.5);
            animation: fadeInDown 0.9s cubic-bezier(0.2,0.9,0.4,1);
            letter-spacing: 2px;
            position: relative;
            display: inline-block;
            padding: 0 20px;
            will-change: transform, opacity;
        }
        .title::before, .title::after {
            content: '';
            font-size: 2.1rem;
            opacity: 0.6;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            color: #f4c542;
            -webkit-text-fill-color: #f4c542;
            text-shadow: 0 0 12px rgba(230, 150, 30, 0.35);
        }
        .title::before {
            left: -40px;
            content: '\f7a6';
        }
        .title::after {
            right: -40px;
            content: '\f7a6';
        }

        .title-notation {
            width: 200px;
            height: 20px;
            margin: 0 auto 1.5rem auto;
            background: repeating-linear-gradient(90deg, transparent, transparent 15px, #c0a070 15px, #c0a070 20px);
            opacity: 0.5;
        }

        .mode-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.8rem;
            margin-top: 1rem;
        }

        .mode-card {
            background: rgba(30, 20, 15, 0.65);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(220, 160, 80, 0.5);
            border-radius: 32px;
            padding: 1.8rem 1.2rem 2.2rem 1.2rem;
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.2,0.9,0.4,1), 
                        box-shadow 0.3s ease, 
                        border-color 0.3s ease;
            box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.7);
            text-align: center;
            animation: fadeInUp 0.8s cubic-bezier(0.2,0.9,0.4,1) backwards;
            position: relative;
            overflow: hidden;
            outline: none;
            will-change: transform, box-shadow;
            backface-visibility: hidden;
        }
        .mode-card:focus-visible {
            border-color: #e3a72e;
            box-shadow: 0 0 0 3px rgba(227, 167, 46, 0.5);
        }

        .mode-card:nth-child(1) { animation-delay: 0.05s; }
        .mode-card:nth-child(2) { animation-delay: 0.15s; }
        .mode-card:nth-child(3) { animation-delay: 0.25s; }

        .mode-card::after {
            content: '';
            position: absolute;
            bottom: 10px;
            left: 15%;
            width: 70%;
            height: 8px;
            background: repeating-linear-gradient(90deg, #d4af37, #d4af37 4px, transparent 4px, transparent 8px);
            opacity: 0.3;
            border-radius: 2px;
        }

        .mode-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: #e3a72e;
            box-shadow: 0 30px 40px -10px rgba(200, 130, 30, 0.5);
            background: rgba(40, 30, 20, 0.75);
        }

        .mode-card:active {
            transform: scale(0.98) translateY(-2px);
            transition: transform 0.08s;
        }

        .mode-icon {
            font-size: 4.5rem;
            line-height: 1;
            margin-bottom: 1.2rem;
            filter: drop-shadow(0 0 15px rgba(230, 150, 30, 0.6));
            transition: transform 0.2s ease;
            will-change: transform;
        }

        .mode-card:hover .mode-icon {
            transform: scale(1.1) rotate(5deg);
        }

        .mode-name {
            font-size: 2rem;
            font-weight: 600;
            color: #f3c26b;
            margin-bottom: 0.6rem;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px #00000050;
        }

        .mode-desc {
            font-size: 1rem;
            color: #ecd9b4;
            line-height: 1.5;
            opacity: 0.95;
            max-width: 280px;
            margin: 0 auto;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .top-left-btn, .top-right-btn {
                top: 10px;
            }
            .top-left-btn {
                left: 10px;
            }
            .top-right-btn {
                right: 10px;
            }
            .nav-btn {
                padding: 6px 12px;
                font-size: 14px;
            }
            .container {
                padding: 1.5rem 1rem;
            }
            .title {
                font-size: 2.2rem;
                margin-bottom: 0.5rem;
            }
            .title::before, .title::after {
                font-size: 1.8rem;
            }
            .title::before { left: -30px; }
            .title::after { right: -30px; }
            .title-notation {
                margin-bottom: 1rem;
            }
            .mode-grid {
                gap: 1.2rem;
            }
            .mode-card {
                padding: 1.5rem 1rem 2rem 1rem;
            }
            .mode-icon {
                font-size: 3.5rem;
            }
            .mode-name {
                font-size: 1.8rem;
            }
            .mode-desc {
                font-size: 0.95rem;
            }
        }

        @media (max-width: 380px) {
            .title {
                font-size: 1.9rem;
            }
            .title::before, .title::after {
                display: none;
            }
        }

        /* ========== 开场动画样式 (性能优化) ========== */
        .intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #1a120b;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            will-change: opacity, background-color;
            cursor: pointer;
            transition: opacity 0.8s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .intro-overlay::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                repeating-linear-gradient(45deg, rgba(100, 60, 20, 0.15) 0px, rgba(100, 60, 20, 0.15) 2px, transparent 2px, transparent 8px),
                linear-gradient(to bottom, transparent 90%, rgba(200, 140, 60, 0.2) 90%),
                linear-gradient(to right, transparent 90%, rgba(200, 140, 60, 0.2) 90%);
            background-size: 20px 20px, 100% 20px, 20px 100%;
            pointer-events: none;
            z-index: -1;
        }

        .intro-overlay::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(transparent, transparent 16.66%, rgba(210, 180, 140, 0.15) 16.66%, rgba(210, 180, 140, 0.15) 16.76%);
            pointer-events: none;
            z-index: -1;
        }

        .intro-content {
            position: relative;
            width: min(70vw, 500px);
            height: min(70vw, 500px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
            perspective: 1000px;
            transform-style: preserve-3d;
        }

        .intro-content img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 20px rgba(255,215,0,0.3));
            opacity: 0;
            will-change: transform, opacity, filter;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
            transform-style: preserve-3d;
            backface-visibility: hidden;
        }

        .intro-hint {
            margin-top: 30px;
            color: rgba(255,255,255,0.7);
            font-size: 1.2rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 500;
            background: rgba(0,0,0,0.4);
            padding: 8px 24px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(227, 167, 46, 0.5);
            transition: all 0.2s ease;
            animation: gentlePulse 1.8s infinite;
            z-index: 2;
            pointer-events: auto;
            cursor: pointer;
            will-change: transform, letter-spacing;
        }
        
        .intro-hint:hover {
            background: rgba(227, 167, 46, 0.3);
            border-color: #e3a72e;
            transform: scale(1.02);
            letter-spacing: 5px;
        }

        @keyframes gentlePulse {
            0% { opacity: 0.5; transform: scale(0.98); box-shadow: 0 0 0 0 rgba(227, 167, 46, 0.3);}
            50% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 8px rgba(227, 167, 46, 0);}
            100% { opacity: 0.5; transform: scale(0.98); box-shadow: 0 0 0 0 rgba(227, 167, 46, 0);}
        }

        .main-content {
            opacity: 0;
            visibility: hidden;
            transition: opacity 1.2s cubic-bezier(0.23, 1, 0.32, 1), visibility 1.2s;
        }
        
        .intro-clickable {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- 开场动画容器 -->
    <div id="intro-overlay" class="intro-overlay intro-clickable">
        <div class="intro-content" id="intro-content">
            <img id="img-guitar-notes" src="{{ url_for('static', filename='images/guitar-notes.png', v='20260420-1') }}" alt="乐符环绕吉他" loading="eager">
        </div>
        <div class="intro-hint" id="intro-hint"><i class="fa-solid fa-guitar" aria-hidden="true"></i><span>点击进入音乐之旅</span><i class="fa-solid fa-guitar" aria-hidden="true"></i></div>
    </div>

    <!-- 主内容 -->
    <div class="main-content">
        <canvas id="particles-js"></canvas>
        <!-- 左上角历史按钮 -->
        <div class="top-left-btn">
            <a href="/history" class="nav-btn" title="训练历史记录"><i class="fa-solid fa-chart-line" aria-hidden="true"></i><span>历史</span></a>
        </div>
        <!-- 右上角用户状态按钮 -->
        <div class="top-right-btn">
            <div id="user-status" class="nav-btn" style="cursor: pointer;">加载中...</div>
        </div>
        <div class="container">
            <h1 class="title">智能吉他和弦教学系统</h1>
            <div class="title-notation"></div>
            <div class="mode-grid">
                <div class="mode-card" onclick="window.location.href='/tuning'" role="button" tabindex="0">
                    <div class="mode-icon">🎵</div>
                    <h3 class="mode-name">调音模式</h3>
                    <p class="mode-desc">精准单弦调音，实时音高检测，渐变仪表盘+弦振动动画，调音完成触发烟花特效</p>
                </div>
                <div class="mode-card" onclick="window.location.href='/solo'" role="button" tabindex="0">
                    <div class="mode-icon">🎶</div>
                    <h3 class="mode-name">SOLO模式</h3>
                    <p class="mode-desc">3D吉他指板，手部骨骼识别，演奏轨迹动画，粒子背景，支持保存演奏记录</p>
                </div>
                <div class="mode-card" onclick="window.location.href='/teach'" role="button" tabindex="0">
                    <div class="mode-icon">📚</div>
                    <h3 class="mode-name">教学驾驶舱</h3>
                    <p class="mode-desc">练习统计看板，和弦掌握度雷达图，进步趋势曲线，AI智能指导</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 粒子动画脚本 (保持原有路径) -->
    <script src="{{ url_for('static', filename='js/index.js') }}"></script>

    <!-- 用户状态管理脚本 -->
    <script>
        async function loadUserStatus() {
            const userStatusDiv = document.getElementById('user-status');
            if (!userStatusDiv) return;

            try {
                const res = await fetch('/api/current_user');
                const data = await res.json();
                if (data.logged_in) {
                    const displayName = data.nickname || data.email;
                    userStatusDiv.innerHTML = `<i class="fa-solid fa-user" aria-hidden="true"></i><span>${displayName}</span>`;
                    userStatusDiv.onclick = () => {
                        if (confirm('是否退出登录？')) {
                            fetch('/api/logout', { method: 'POST' }).then(() => {
                                window.location.reload();
                            });
                        }
                    };
                } else {
                    userStatusDiv.innerHTML = '<i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i><span>登录</span>';
                    userStatusDiv.onclick = () => {
                        window.location.href = '/login';
                    };
                }
            } catch (err) {
                console.error('获取用户状态失败', err);
                userStatusDiv.innerHTML = '<i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i><span>登录</span>';
                userStatusDiv.onclick = () => {
                    window.location.href = '/login';
                };
            }
        }
        loadUserStatus();
    </script>

    <!-- 开场动画：点击进入 + 只播放一次，并确保图片可见 (动效优化) -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            'use strict';

            const redirectAfter = '{{ redirect_after_intro | default("") }}';
            const overlay = document.getElementById('intro-overlay');
            const guitarImg = document.getElementById('img-guitar-notes');
            const mainContent = document.querySelector('.main-content');
            const hintBtn = document.getElementById('intro-hint');
            const introVersion = 'guitar-notes-20260420-1';

            // 关键元素缺失则直接显示主内容
            if (!overlay || !guitarImg || !mainContent) {
                console.warn('❌ 开场元素缺失，直接显示主内容');
                if (overlay) overlay.style.display = 'none';
                if (mainContent) {
                    mainContent.style.visibility = 'visible';
                    mainContent.style.opacity = '1';
                }
                return;
            }

            // 减少动效偏好：直接跳过动画
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                console.log('🎯 检测到减少动效偏好，跳过开场动画');
                overlay.style.display = 'none';
                mainContent.style.visibility = 'visible';
                mainContent.style.opacity = '1';
                return;
            }

            // 监听图片加载状态
            guitarImg.onload = () => console.log('✅ 图片加载成功:', guitarImg.src);
            guitarImg.onerror = () => console.error('❌ 图片加载失败:', guitarImg.src);

            // 有重定向参数（如登录后跳转）：自动播放动画并跳转
            if (redirectAfter) {
                console.log('🚀 检测到重定向参数，自动跳转');
                overlay.style.pointerEvents = 'auto';
                gsap.set(guitarImg, {
                    opacity: 0,
                    scale: 0.8,
                    filter: 'blur(8px) brightness(0.6)',
                    rotationY: -15,
                    rotationX: 5,
                    transformPerspective: 1000
                });
                const autoTl = gsap.timeline({
                    onComplete: () => {
                        gsap.to(overlay, {
                            opacity: 0,
                            duration: 1.0,
                            ease: "power2.inOut",
                            onComplete: () => {
                                window.location.href = redirectAfter;
                            }
                        });
                    }
                });
                autoTl.to(guitarImg, {
                    opacity: 1,
                    scale: 1,
                    filter: 'blur(0px) brightness(1)',
                    rotationY: 0,
                    rotationX: 0,
                    duration: 1.2,
                    ease: "elastic.out(1, 0.5)",
                })
                .to(guitarImg, {
                    duration: 1.0,
                    ease: "none"
                })
                .to(guitarImg, {
                    duration: 0.6,
                    scale: 1.1,
                    opacity: 0.9,
                    filter: 'blur(3px) brightness(1.2)',
                    ease: "power2.in"
                });
                overlay.style.cursor = 'default';
                overlay.style.pointerEvents = 'none';
                return;
            }

            // 普通主页：检查是否已经播放过开场动画（只播放一次）
            const introPlayedVersion = sessionStorage.getItem('introPlayedVersion');
            if (introPlayedVersion !== introVersion) {
                sessionStorage.removeItem('introPlayed');
                sessionStorage.setItem('introPlayedVersion', introVersion);
            }
            const hasPlayed = sessionStorage.getItem('introPlayed');
            if (hasPlayed) {
                console.log('⏩ 开场动画已播放过，跳过');
                overlay.style.display = 'none';
                mainContent.style.visibility = 'visible';
                mainContent.style.opacity = '1';
                return;
            }

            // 未播放过：显示开场动画，等待点击进入
            console.log('🎬 首次进入，展示开场动画，等待点击');
            overlay.style.display = 'flex';
            overlay.style.opacity = '1';
            overlay.style.pointerEvents = 'auto';
            mainContent.style.visibility = 'hidden';
            mainContent.style.opacity = '0';

            // 初始设置吉他样式
            gsap.set(guitarImg, {
                opacity: 0,
                scale: 0.75,
                filter: 'blur(10px) brightness(0.65)',
                rotationY: -20,
                rotationX: 8,
                transformPerspective: 1200
            });

            // 循环呼吸动画（让图片可见并呼吸）
            const idleTl = gsap.timeline({ repeat: -1, yoyo: true, repeatDelay: 1, ease: "sine.inOut" });
            idleTl.to(guitarImg, {
                duration: 3,
                opacity: 1,
                scale: 1.02,
                filter: 'blur(0px) brightness(1.05) drop-shadow(0 0 30px rgba(255,200,50,0.6))',
                rotationY: -5,
                rotationX: 3,
                ease: "sine.inOut"
            }, 0)
            .to(guitarImg, {
                duration: 3,
                opacity: 0.95,
                scale: 0.98,
                filter: 'blur(0px) brightness(0.98) drop-shadow(0 0 15px rgba(255,180,30,0.4))',
                rotationY: 5,
                rotationX: -2,
                ease: "sine.inOut"
            }, 3);

            // 提示文字微动
            gsap.to(hintBtn, {
                duration: 1.5,
                scale: 1.05,
                repeat: -1,
                yoyo: true,
                ease: "power1.inOut"
            });

            let isTransitioning = false;
            const enterMain = () => {
                if (isTransitioning) return;
                isTransitioning = true;
                console.log('✨ 用户点击进入，记录标记并淡出');
                // 存储标记
                sessionStorage.setItem('introPlayed', 'true');
                // 停止循环动画
                idleTl.kill();
                gsap.killTweensOf(guitarImg);
                gsap.killTweensOf(hintBtn);
                // 吉他退出动画
                gsap.to(guitarImg, {
                    duration: 0.7,
                    scale: 1.3,
                    opacity: 0,
                    rotationY: 25,
                    rotationX: -10,
                    filter: 'blur(15px) brightness(1.3)',
                    ease: "back.in(1.2)"
                });
                // 遮罩层淡出
                gsap.to(overlay, {
                    duration: 0.8,
                    opacity: 0,
                    ease: "power2.inOut",
                    onComplete: () => {
                        overlay.style.display = 'none';
                        overlay.style.pointerEvents = 'none';
                        // 主内容淡入
                        mainContent.style.visibility = 'visible';
                        gsap.fromTo(mainContent, 
                            { y: 30, opacity: 0 },
                            { y: 0, opacity: 1, duration: 1.0, ease: "back.out(0.5)", clearProps: "y" }
                        );
                        console.log('🏠 主界面已显示');
                    }
                });
            };

            // 点击进入
            overlay.addEventListener('click', enterMain);
            hintBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                enterMain();
            });

            // 键盘支持
            const handleKey = (e) => {
                if (isTransitioning) return;
                if (e.key === 'Enter' || e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    enterMain();
                }
            };
            window.addEventListener('keydown', handleKey);
        });
    </script>

    <!-- 键盘支持脚本 -->
    <script>
        document.querySelectorAll('.mode-card[role="button"]').forEach(card => {
            card.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    card.click();
                }
            });
        });
    </script>
    
    <!-- 语音助手支持 -->
    <script>
        if (window.VoiceGuide) {
            VoiceGuide.registerPageCommands('/', []);
        }
    </script>
    <!-- ✅ 国内镜像：Socket.IO (BootCDN) -->
    <script src="https://cdn.bootcdn.net/ajax/libs/socket.io/4.5.4/socket.io.min.js"></script>
    <script src="/static/js/voice_guide.js"></script>
</body>
