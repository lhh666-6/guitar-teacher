<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能吉他教学系统 · 音乐家风格</title>
    <!-- 引入 GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
        /* ========== 原有完整样式 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', 'Georgia', serif;
            min-height: 100vh;
            background: #1a120b;
            color: #fff;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                repeating-linear-gradient(45deg, rgba(100, 60, 20, 0.15) 0px, rgba(100, 60, 20, 0.15) 2px, transparent 2px, transparent 8px),
                linear-gradient(to bottom, transparent 90%, rgba(200, 140, 60, 0.2) 90%),
                linear-gradient(to right, transparent 90%, rgba(200, 140, 60, 0.2) 90%);
            background-size: 20px 20px, 100% 20px, 20px 100%;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(transparent, transparent 16.66%, rgba(210, 180, 140, 0.15) 16.66%, rgba(210, 180, 140, 0.15) 16.76%);
            pointer-events: none;
            z-index: 0;
        }

        #particles-js {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: block;
            pointer-events: none;
        }

        .history-link {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            display: inline-flex;
            align-items: center;
            padding: 8px 16px;
            background: rgba(30, 20, 15, 0.65);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(220, 160, 80, 0.5);
            border-radius: 40px;
            color: #ecd9b4;
            font-size: 16px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .history-link:hover {
            background: rgba(50, 35, 25, 0.8);
            border-color: #e3a72e;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(200, 130, 30, 0.4);
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
        }

        .title {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            background: linear-gradient(135deg, #f4c542, #e3a72e, #c6861f);
            -webkit-background-clip: text;
            background-clip: text; 
            color: transparent;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(230, 150, 30, 0.5);
            animation: fadeInDown 1s ease;
            letter-spacing: 2px;
            position: relative;
            display: inline-block;
            padding: 0 20px;
        }
        .title::before, .title::after {
            content: '🎸';
            font-size: 2.5rem;
            opacity: 0.6;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
        }
        .title::before { left: -40px; }
        .title::after { right: -40px; }

        .title-notation {
            width: 200px;
            height: 20px;
            margin: 0 auto 1.5rem auto;
            background: repeating-linear-gradient(90deg, transparent, transparent 15px, #c0a070 15px, #c0a070 20px);
            opacity: 0.5;
        }

        .mode-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.8rem;
            margin-top: 1rem;
        }

        .mode-card {
            background: rgba(30, 20, 15, 0.65);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(220, 160, 80, 0.5);
            border-radius: 32px;
            padding: 1.8rem 1.2rem 2.2rem 1.2rem;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.7);
            text-align: center;
            animation: fadeInUp 1s ease backwards;
            position: relative;
            overflow: hidden;
            outline: none;
        }
        .mode-card:focus-visible {
            border-color: #e3a72e;
            box-shadow: 0 0 0 3px rgba(227, 167, 46, 0.5);
        }

        .mode-card:nth-child(1) { animation-delay: 0.1s; }
        .mode-card:nth-child(2) { animation-delay: 0.2s; }
        .mode-card:nth-child(3) { animation-delay: 0.3s; }

        .mode-card::after {
            content: '';
            position: absolute;
            bottom: 10px;
            left: 15%;
            width: 70%;
            height: 8px;
            background: repeating-linear-gradient(90deg, #d4af37, #d4af37 4px, transparent 4px, transparent 8px);
            opacity: 0.3;
            border-radius: 2px;
        }

        .mode-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: #e3a72e;
            box-shadow: 0 30px 40px -10px rgba(200, 130, 30, 0.5);
            background: rgba(40, 30, 20, 0.75);
        }

        .mode-card:active {
            transform: scale(0.98) translateY(-2px);
            transition: transform 0.1s;
        }

        .mode-icon {
            font-size: 4.5rem;
            line-height: 1;
            margin-bottom: 1.2rem;
            filter: drop-shadow(0 0 15px rgba(230, 150, 30, 0.6));
            transition: transform 0.2s;
        }

        .mode-card:hover .mode-icon {
            transform: scale(1.1) rotate(5deg);
        }

        .mode-name {
            font-size: 2rem;
            font-weight: 600;
            color: #f3c26b;
            margin-bottom: 0.6rem;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px #00000050;
        }

        .mode-desc {
            font-size: 1rem;
            color: #ecd9b4;
            line-height: 1.5;
            opacity: 0.95;
            max-width: 280px;
            margin: 0 auto;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .history-link {
                top: 10px;
                left: 10px;
                padding: 6px 12px;
                font-size: 14px;
            }
            .container {
                padding: 1.5rem 1rem;
            }
            .title {
                font-size: 2.2rem;
                margin-bottom: 0.5rem;
            }
            .title::before, .title::after {
                font-size: 1.8rem;
            }
            .title::before { left: -30px; }
            .title::after { right: -30px; }
            .title-notation {
                margin-bottom: 1rem;
            }
            .mode-grid {
                gap: 1.2rem;
            }
            .mode-card {
                padding: 1.5rem 1rem 2rem 1rem;
            }
            .mode-icon {
                font-size: 3.5rem;
            }
            .mode-name {
                font-size: 1.8rem;
            }
            .mode-desc {
                font-size: 0.95rem;
            }
        }

        @media (max-width: 380px) {
            .title {
                font-size: 1.9rem;
            }
            .title::before, .title::after {
                display: none;
            }
        }

        /* ========== 开场动画样式（背景与index一致） ========== */
        .intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #1a120b;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            will-change: background-color;
        }

        .intro-overlay::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                repeating-linear-gradient(45deg, rgba(100, 60, 20, 0.15) 0px, rgba(100, 60, 20, 0.15) 2px, transparent 2px, transparent 8px),
                linear-gradient(to bottom, transparent 90%, rgba(200, 140, 60, 0.2) 90%),
                linear-gradient(to right, transparent 90%, rgba(200, 140, 60, 0.2) 90%);
            background-size: 20px 20px, 100% 20px, 20px 100%;
            pointer-events: none;
            z-index: -1;
        }

        .intro-overlay::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(transparent, transparent 16.66%, rgba(210, 180, 140, 0.15) 16.66%, rgba(210, 180, 140, 0.15) 16.76%);
            pointer-events: none;
            z-index: -1;
        }

        .intro-content {
            position: relative;
            width: min(70vw, 500px);
            height: min(70vw, 500px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
            perspective: 1000px;
        }

        .intro-content img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 20px rgba(255,215,0,0.3));
            opacity: 0;
            will-change: transform, opacity, filter;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
            transform-style: preserve-3d;
        }

        .intro-hint {
            margin-top: 30px;
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
            animation: subtlePulse 3s infinite;
            z-index: 2;
        }

        @keyframes subtlePulse {
            0% { opacity: 0.3; }
            50% { opacity: 0.8; }
            100% { opacity: 0.3; }
        }

        .main-content {
            opacity: 0;
            visibility: hidden;
            transition: opacity 1.2s cubic-bezier(0.23, 1, 0.32, 1), visibility 1.2s;
        }
    </style>
</head>
<body>
    <!-- 开场动画容器（只保留吉他图片） -->
    <div id="intro-overlay" class="intro-overlay">
        <div class="intro-content" id="intro-content">
            <img id="img-guitar-notes" src="/static/images/guitar-notes.png" alt="乐符环绕吉他" onerror="console.error('图片加载失败:', this.src)">
        </div>
        <div class="intro-hint">✨ 即将进入</div>
    </div>

    <!-- 主内容（原有界面） -->
    <div class="main-content">
        <canvas id="particles-js"></canvas>
        <a href="/history" class="history-link" title="训练历史记录">📊 历史</a>
        <div class="container">
            <h1 class="title">智能吉他和弦教学系统</h1>
            <div class="title-notation"></div>
            <div class="mode-grid">
                <div class="mode-card" onclick="window.location.href='/tuning'" role="button" tabindex="0">
                    <div class="mode-icon">🎵</div>
                    <h3 class="mode-name">调音模式</h3>
                    <p class="mode-desc">精准单弦调音，实时音高检测，渐变仪表盘+弦振动动画，调音完成触发烟花特效</p>
                </div>
                <div class="mode-card" onclick="window.location.href='/solo'" role="button" tabindex="0">
                    <div class="mode-icon">🎶</div>
                    <h3 class="mode-name">SOLO模式</h3>
                    <p class="mode-desc">3D吉他指板，手部骨骼识别，演奏轨迹动画，粒子背景，支持保存演奏记录</p>
                </div>
                <div class="mode-card" onclick="window.location.href='/teach'" role="button" tabindex="0">
                    <div class="mode-icon">📚</div>
                    <h3 class="mode-name">教学驾驶舱</h3>
                    <p class="mode-desc">练习统计看板，和弦掌握度雷达图，进步趋势曲线，AI智能指导</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 粒子动画脚本（如果存在） -->
    <script src="{{ url_for('static', filename='js/index.js') }}"></script>

    <!-- 开场动画脚本（单张吉他，伪3D，总时长3秒） -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            'use strict';

            const overlay = document.getElementById('intro-overlay');
            const content = document.getElementById('intro-content');
            const guitar = document.getElementById('img-guitar-notes');
            const mainContent = document.querySelector('.main-content');

            // 检查是否已播放过
            const hasPlayed = sessionStorage.getItem('introPlayed');

            if (hasPlayed) {
                console.log('⏩ 开场动画已播放过，跳过');
                if (overlay) overlay.style.display = 'none';
                if (mainContent) {
                    mainContent.style.visibility = 'visible';
                    mainContent.style.opacity = '1';
                }
                return;
            }

            if (!overlay || !guitar || !mainContent) {
                console.error('❌ 开场元素缺失，直接显示主内容');
                if (overlay) overlay.style.display = 'none';
                if (mainContent) {
                    mainContent.style.visibility = 'visible';
                    mainContent.style.opacity = '1';
                }
                return;
            }

            console.log('✅ 开场元素已找到，开始动画');
            console.log('吉他图片路径:', guitar.src);

            // 初始状态
            gsap.set(guitar, {
                opacity: 0,
                scale: 0.8,
                filter: 'blur(8px) brightness(0.6)',
                rotationY: -15,
                rotationX: 5,
                transformPerspective: 1000
            });

            // 创建时间线
            const tl = gsap.timeline({
                smoothChildTiming: true,
                onStart: () => console.log('🎬 时间线开始'),
                onComplete: () => {
                    console.log('🎬 时间线完成');
                    sessionStorage.setItem('introPlayed', 'true');
                }
            });

            // 吉他淡入 + 伪3D旋转到正常位置，持续2秒
            tl.to(guitar, {
                opacity: 1,
                scale: 1,
                filter: 'blur(0px) brightness(1)',
                rotationY: 0,
                rotationX: 0,
                duration: 2,
                ease: "elastic.out(1, 0.4)",
                onStart: () => console.log('🎬 [0s] 吉他淡入并旋转')
            })
            // 停留1秒
            .to(guitar, {
                duration: 1,
                ease: "none",
                onStart: () => console.log('🎬 [2s] 停留1秒')
            })
            // 动画结束后自动进入主页（不淡出，直接进入）
            .call(() => {
                console.log('🚪 3秒到，自动进入主页');
                gsap.killTweensOf(guitar);
                gsap.to(overlay, {
                    opacity: 0,
                    duration: 1.2,
                    ease: "power2.inOut",
                    onComplete: () => {
                        overlay.style.display = 'none';
                        mainContent.style.visibility = 'visible';
                        gsap.fromTo(mainContent,
                            { y: 20, opacity: 0 },
                            { y: 0, opacity: 1, duration: 1.2, ease: "power2.out", clearProps: "y" }
                        );
                        console.log('🏠 主界面已显示');
                    }
                });
            }, "+=0");

            // 悬停加速
            content.addEventListener('mouseenter', () => {
                tl.timeScale(2);
                gsap.to(guitar, {
                    filter: 'drop-shadow(0 0 40px rgba(255,215,0,0.9)) brightness(1.2)',
                    duration: 0.4,
                    overwrite: true
                });
                console.log('🐭 悬停加速: 2x');
            });
            content.addEventListener('mouseleave', () => {
                tl.timeScale(1);
                gsap.to(guitar, {
                    filter: 'drop-shadow(0 0 20px rgba(255,215,0,0.3)) brightness(1)',
                    duration: 0.6,
                    overwrite: true
                });
                console.log('🐭 悬停恢复: 1x');
            });

            // 强制超时：5秒后强制进入（比总时长多2秒）
            setTimeout(() => {
                if (overlay.style.display !== 'none') {
                    console.warn('⚠️ 强制超时：5秒已过，强制进入主页');
                    tl.pause();
                    gsap.killTweensOf(guitar);
                    gsap.to(overlay, {
                        opacity: 0,
                        duration: 1.2,
                        ease: "power2.inOut",
                        onComplete: () => {
                            overlay.style.display = 'none';
                            mainContent.style.visibility = 'visible';
                            gsap.fromTo(mainContent,
                                { y: 20, opacity: 0 },
                                { y: 0, opacity: 1, duration: 1.2, ease: "power2.out", clearProps: "y" }
                            );
                            sessionStorage.setItem('introPlayed', 'true');
                        }
                    });
                }
            }, 5000);

            console.log('🎬 动画序列已启动');
        });
    </script>

    <!-- 键盘支持脚本 -->
    <script>
        document.querySelectorAll('.mode-card[role="button"]').forEach(card => {
            card.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    card.click();
                }
            });
        });
    </script>
    <script>
    if (window.VoiceGuide) {
        VoiceGuide.registerPageCommands('/', []);
    }
</script>

    if (window.VoiceGuide) {
        VoiceGuide.registerPageCommands('/', []);
    }
</script>

</body>
