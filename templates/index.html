<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>智能吉他和弦教学系统</title>
    <!-- DNS 预解析 + 预连接 -->
    <link rel="dns-prefetch" href="https://cdn.bootcdn.net">
    <link rel="dns-prefetch" href="https://cdn.staticfile.org">
    <link rel="preconnect" href="https://cdn.bootcdn.net" crossorigin>
    <link rel="preconnect" href="https://cdn.staticfile.org" crossorigin>
    <!-- GSAP -->
    <script src="https://cdn.bootcdn.net/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <!-- Font Awesome -->
<script>(function(){var t=localStorage.getItem('theme');if(!t||t!=='dark')document.documentElement.setAttribute('data-theme','light');})();</script>
    <link rel="stylesheet" href="https://cdn.staticfile.org/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/static/css/base.css?v={{ APP_VERSION }}">
    <link rel="stylesheet" href="/static/css/index.css?v={{ APP_VERSION }}">
</head>
<body>
    <!-- 开场动画容器 -->
    <div id="intro-overlay" class="intro-overlay intro-clickable">
        <div class="intro-content" id="intro-content">
            <img id="img-guitar-notes" src="/static/images/guitar-notes.webp" alt="乐符环绕吉他" loading="eager">
        </div>
        <div class="intro-hint" id="intro-hint"> 点击进入 </div>
    </div>

    <!-- 主内容 -->
    <div class="main-content">
        <canvas id="particles-js"></canvas>
        <div class="top-left-btn">
            <a href="/history" class="nav-btn"><i class="fas fa-history"></i> 历史</a>
        </div>
        <div class="top-right-btn" style="display:flex;align-items:center;gap:10px;">
            <button id="theme-toggle" class="nav-btn" title="切换日间/夜间模式" style="cursor:pointer;background:transparent;border:1px solid var(--border-medium);">
                <i class="fas fa-moon"></i>
            </button>
            <div id="user-status" class="nav-btn" style="cursor: pointer;">加载中...</div>
        </div>
        <div class="container">
            <h1 class="title">智能吉他和弦教学系统</h1>
            <div class="title-notation"></div>
            <div class="mode-grid">
                <div class="mode-card" onclick="window.location.href='/tuning'" role="button" tabindex="0">
                    <div class="mode-icon">
                        <i class="fas fa-microphone-alt"></i>
                    </div>
                    <h3 class="mode-name">调音器</h3>
                    <p class="mode-desc">YIN 音高检测引擎，±2 音分精度，智能逐弦引导</p>
                </div>
                <div class="mode-card" onclick="window.location.href='/solo'" role="button" tabindex="0">
                    <div class="mode-icon">
                        <i class="fas fa-guitar"></i>
                    </div>
                    <h3 class="mode-name">和弦测试</h3>
                    <p class="mode-desc">视听融合识别：指法视觉检测 + 音高听觉验证，覆盖 70+ 标准和弦</p>
                </div>
                <div class="mode-card" onclick="window.location.href='/teach'" role="button" tabindex="0">
                    <div class="mode-icon">
                        <i class="fas fa-chalkboard-teacher"></i>
                    </div>
                    <h3 class="mode-name">教学驾驶舱</h3>
                    <p class="mode-desc">练习数据全景视图，掌握度雷达分析与进步曲线追踪</p>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/index.js') }}?v={{ APP_VERSION }}"></script>

    <script>
        // 主题切换
        (function(){
            var btn = document.getElementById('theme-toggle');
            if (!btn) return;
            var icon = btn.querySelector('i');
            function setUI(t) {
                if (t === 'light') {
                    icon.className = 'fas fa-sun';
                    btn.style.color = '#d49840';
                } else {
                    icon.className = 'fas fa-moon';
                    btn.style.color = '';
                }
            }
            setUI(document.documentElement.getAttribute('data-theme') || 'light');
            btn.addEventListener('click', function(){
                var curr = document.documentElement.getAttribute('data-theme');
                var next = (curr === 'light') ? 'dark' : 'light';
                if (next === 'light') {
                    document.documentElement.setAttribute('data-theme', 'light');
                    localStorage.setItem('theme', 'light');
                } else {
                    document.documentElement.removeAttribute('data-theme');
                    localStorage.setItem('theme', 'dark');
                }
                setUI(next);
            });
        })();

        async function loadUserStatus() {
            const userStatusDiv = document.getElementById('user-status');
            if (!userStatusDiv) return;

            try {
                const res = await fetch('/api/current_user');
                const data = await res.json();
                if (data.logged_in) {
                    const displayName = data.nickname || data.email;
                    userStatusDiv.innerHTML = `<i class="fas fa-user"></i> ${displayName}`;
                    userStatusDiv.onclick = () => {
                        if (confirm('是否退出登录？')) {
                            fetch('/api/logout', { method: 'POST' }).then(() => {
                                window.location.reload();
                            });
                        }
                    };
                } else {
                    userStatusDiv.innerHTML = '<i class="fas fa-sign-in-alt"></i> 登录';
                    userStatusDiv.onclick = () => {
                        window.location.href = '/login';
                    };
                }
            } catch (err) {
                console.error('获取用户状态失败', err);
                userStatusDiv.innerHTML = '<i class="fas fa-sign-in-alt"></i> 登录';
                userStatusDiv.onclick = () => {
                    window.location.href = '/login';
                };
            }
        }
        loadUserStatus();
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            'use strict';

            const redirectAfter = '{{ redirect_after_intro | default("") }}';
            const overlay = document.getElementById('intro-overlay');
            const guitarImg = document.getElementById('img-guitar-notes');
            const mainContent = document.querySelector('.main-content');
            const hintBtn = document.getElementById('intro-hint');

            if (!overlay || !guitarImg || !mainContent) {
                console.warn('[WARN] 开场元素缺失，直接显示主内容');
                if (overlay) overlay.style.display = 'none';
                if (mainContent) {
                    mainContent.style.visibility = 'visible';
                    mainContent.style.opacity = '1';
                }
                return;
            }

            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                console.log('[A11Y] 检测到减少动效偏好，跳过开场动画');
                overlay.style.display = 'none';
                mainContent.style.visibility = 'visible';
                mainContent.style.opacity = '1';
                return;
            }

            if (typeof gsap === 'undefined') {
                console.warn('[WARN] GSAP 未加载（CDN不可用），跳过开场动画');
                overlay.style.display = 'none';
                mainContent.style.visibility = 'visible';
                mainContent.style.opacity = '1';
                return;
            }

            guitarImg.onload = () => console.log('[ OK ] 图片加载成功:', guitarImg.src);
            guitarImg.onerror = () => console.error('[FAIL] 图片加载失败:', guitarImg.src);

            if (redirectAfter) {
                console.log('[AUTO] 检测到重定向参数，自动跳转');
                overlay.style.pointerEvents = 'auto';
                gsap.set(guitarImg, {
                    opacity: 0,
                    scale: 0.8,
                    filter: 'blur(8px) brightness(0.6)',
                    rotationY: -15,
                    rotationX: 5,
                    transformPerspective: 1000
                });
                const autoTl = gsap.timeline({
                    onComplete: () => {
                        gsap.to(overlay, {
                            opacity: 0,
                            duration: 1.0,
                            ease: "power2.inOut",
                            onComplete: () => {
                                window.location.href = redirectAfter;
                            }
                        });
                    }
                });
                autoTl.to(guitarImg, {
                    opacity: 1,
                    scale: 1,
                    filter: 'blur(0px) brightness(1)',
                    rotationY: 0,
                    rotationX: 0,
                    duration: 1.2,
                    ease: "elastic.out(1, 0.5)",
                })
                .to(guitarImg, {
                    duration: 1.0,
                    ease: "none"
                })
                .to(guitarImg, {
                    duration: 0.6,
                    scale: 1.1,
                    opacity: 0.9,
                    filter: 'blur(3px) brightness(1.2)',
                    ease: "power2.in"
                });
                overlay.style.cursor = 'default';
                overlay.style.pointerEvents = 'none';
                return;
            }

            function showMainContent() {
                mainContent.style.visibility = 'visible';
                mainContent.style.opacity = '1';
            }

            function skipIntro() {
                console.log('[SKIP] 开场动画已播放过，跳过');
                showMainContent();
            }

            // bfcache 恢复时也检查一遍
            window.addEventListener('pageshow', (e) => {
                if (e.persisted && sessionStorage.getItem('introPlayed')) {
                    overlay.style.display = 'none';
                    showMainContent();
                }
            });

            const hasPlayed = sessionStorage.getItem('introPlayed');
            if (hasPlayed) {
                skipIntro();
                return;
            }

            console.log('[INTRO] 首次进入，展示开场动画，等待点击');
            overlay.style.display = 'flex';
            overlay.style.opacity = '1';
            overlay.style.pointerEvents = 'auto';
            mainContent.style.visibility = 'hidden';
            mainContent.style.opacity = '0';

            gsap.set(guitarImg, {
                opacity: 0,
                scale: 0.75,
                filter: 'blur(10px) brightness(0.65)',
                rotationY: -20,
                rotationX: 8,
                transformPerspective: 1200
            });

            const idleTl = gsap.timeline({ repeat: -1, yoyo: true, repeatDelay: 1, ease: "sine.inOut" });
            idleTl.to(guitarImg, {
                duration: 3,
                opacity: 1,
                scale: 1.02,
                filter: 'blur(0px) brightness(1.05) drop-shadow(0 0 30px rgba(255,200,50,0.6))',
                rotationY: -5,
                rotationX: 3,
                ease: "sine.inOut"
            }, 0)
            .to(guitarImg, {
                duration: 3,
                opacity: 0.95,
                scale: 0.98,
                filter: 'blur(0px) brightness(0.98) drop-shadow(0 0 15px rgba(255,180,30,0.4))',
                rotationY: 5,
                rotationX: -2,
                ease: "sine.inOut"
            }, 3);

            gsap.to(hintBtn, {
                duration: 1.5,
                scale: 1.05,
                repeat: -1,
                yoyo: true,
                ease: "power1.inOut"
            });

            let isTransitioning = false;
            const enterMain = () => {
                if (isTransitioning) return;
                isTransitioning = true;
                console.log('[DONE] 用户点击进入，记录标记并淡出');
                sessionStorage.setItem('introPlayed', 'true');
                idleTl.kill();
                gsap.killTweensOf(guitarImg);
                gsap.killTweensOf(hintBtn);
                gsap.to(guitarImg, {
                    duration: 0.7,
                    scale: 1.3,
                    opacity: 0,
                    rotationY: 25,
                    rotationX: -10,
                    filter: 'blur(15px) brightness(1.3)',
                    ease: "back.in(1.2)"
                });
                gsap.to(overlay, {
                    duration: 0.8,
                    opacity: 0,
                    ease: "power2.inOut",
                    onComplete: () => {
                        overlay.style.display = 'none';
                        overlay.style.pointerEvents = 'none';
                        mainContent.style.visibility = 'visible';
                        gsap.fromTo(mainContent, 
                            { y: 30, opacity: 0 },
                            { y: 0, opacity: 1, duration: 1.0, ease: "back.out(0.5)", clearProps: "y" }
                        );
                        console.log('[READY] 主界面已显示');
                    }
                });
            };

            overlay.addEventListener('click', enterMain);
            hintBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                enterMain();
            });

            const handleKey = (e) => {
                if (isTransitioning) return;
                if (e.key === 'Enter' || e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    enterMain();
                }
            };
            window.addEventListener('keydown', handleKey);
        });
    </script>

    <script>
        document.querySelectorAll('.mode-card[role="button"]').forEach(card => {
            card.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    card.click();
                }
            });
        });
    </script>
    <script defer src="https://cdn.bootcdn.net/ajax/libs/socket.io/4.5.4/socket.io.min.js"></script>
</body>
</html>
