<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>品丝绘制模拟</title>
<style>
  body { margin:0; background:#1a1a2e; color:#eee; font-family:Arial; display:flex; justify-content:center; padding:20px; }
  canvas { background:#000; border:1px solid #333; }
  .info { margin-left:20px; font-size:13px; line-height:1.8; }
  .info span { color:#d4a030; }
</style>
</head>
<body>
<canvas id="c" width="1000" height="400"></canvas>
<div class="info">
  <h3>吉他指板 Overlay 模拟</h3>
  <p>琴枕 (Nut): <span>金色加粗</span></p>
  <p>品丝 (Fret): <span>白线</span>，长度从琴枕→琴桥线性递增</p>
  <p>琴弦 (String): <span>金色细线</span></p>
  <p>下方数字: <span>品号</span></p>
  <p style="margin-top:12px;color:#888;">
    模拟参数: nut_h=60, bridge_h=110<br>
    品丝长度区间: 51 → 93.5 (递增 83%)
  </p>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// 模拟参数（缩略图坐标系）
const nut_center = [120, H/2];
const bridge_center = [880, H/2];
const nut_h = 60;
const bridge_h = 88;
const NUM_FRETS = 12;
const NUM_STRINGS = 6;
const STRING_EDGE_SHRINK_RATIO = 0.1;

// 单位向量
const dx = bridge_center[0] - nut_center[0];
const dy = bridge_center[1] - nut_center[1];
const v_len = Math.hypot(dx, dy);
const v_unit = [dx / v_len, dy / v_len];
const perp_unit = [-dy / v_len, dx / v_len];  // 旋转90度

function getPointOnLine(p1, p2, ratio) {
  return [p1[0] + (p2[0]-p1[0]) * ratio, p1[1] + (p2[1]-p1[1]) * ratio];
}

function getFretPositionRatio(n) {
  return 1.0 - Math.pow(2, -n / 12.0);
}

// 琴枕线端点
const half_h_nut = nut_h * 0.85 / 2;
const nut_p1 = [nut_center[0] + perp_unit[0] * half_h_nut, nut_center[1] + perp_unit[1] * half_h_nut];
const nut_p2 = [nut_center[0] - perp_unit[0] * half_h_nut, nut_center[1] - perp_unit[1] * half_h_nut];

// 品丝线
const half_h_bridge = bridge_h * 0.85 / 2;
const frets = [];
for (let n = 1; n <= NUM_FRETS; n++) {
  const ratio = getFretPositionRatio(n);
  const center = getPointOnLine(nut_center, bridge_center, ratio);
  const half_h = half_h_nut + (half_h_bridge - half_h_nut) * ratio;
  const p1 = [center[0] + perp_unit[0] * half_h, center[1] + perp_unit[1] * half_h];
  const p2 = [center[0] - perp_unit[0] * half_h, center[1] - perp_unit[1] * half_h];
  frets.push({ n, p1, p2, center, len: half_h * 2 });
}

// 琴弦线
const nut_top = [nut_center[0] + perp_unit[0]*(nut_h/2), nut_center[1] + perp_unit[1]*(nut_h/2)];
const nut_bottom = [nut_center[0] - perp_unit[0]*(nut_h/2), nut_center[1] - perp_unit[1]*(nut_h/2)];
const bridge_top = [bridge_center[0] + perp_unit[0]*(bridge_h/2), bridge_center[1] + perp_unit[1]*(bridge_h/2)];
const bridge_bottom = [bridge_center[0] - perp_unit[0]*(bridge_h/2), bridge_center[1] - perp_unit[1]*(bridge_h/2)];

const shrink_nut_top = getPointOnLine(nut_top, nut_bottom, STRING_EDGE_SHRINK_RATIO);
const shrink_nut_bottom = getPointOnLine(nut_bottom, nut_top, STRING_EDGE_SHRINK_RATIO);
const shrink_bridge_top = getPointOnLine(bridge_top, bridge_bottom, STRING_EDGE_SHRINK_RATIO);
const shrink_bridge_bottom = getPointOnLine(bridge_bottom, bridge_top, STRING_EDGE_SHRINK_RATIO);

const strings = [];
for (let i = 0; i < NUM_STRINGS; i++) {
  const t = i / (NUM_STRINGS - 1);
  strings.push({
    nut: getPointOnLine(shrink_nut_top, shrink_nut_bottom, t),
    bridge: getPointOnLine(shrink_bridge_top, shrink_bridge_bottom, t)
  });
}

// ===== 绘制 =====
ctx.clearRect(0, 0, W, H);

// 1. 琴弦
strings.forEach(s => {
  ctx.beginPath();
  ctx.moveTo(s.nut[0], s.nut[1]);
  ctx.lineTo(s.bridge[0], s.bridge[1]);
  ctx.strokeStyle = '#e0bc6e';
  ctx.lineWidth = 1.5;
  ctx.stroke();
});

// 2. 琴枕线 (fret 0)
ctx.beginPath();
ctx.moveTo(nut_p1[0], nut_p1[1]);
ctx.lineTo(nut_p2[0], nut_p2[1]);
ctx.strokeStyle = '#d4a030';
ctx.lineWidth = 3;
ctx.stroke();

// 琴枕标签
ctx.fillStyle = '#d4a030';
ctx.font = 'bold 11px Arial';
ctx.textAlign = 'center';
ctx.fillText('琴枕', nut_center[0], nut_center[1] + half_h_nut + 18);

// 3. 品丝
frets.forEach(f => {
  ctx.beginPath();
  ctx.moveTo(f.p1[0], f.p1[1]);
  ctx.lineTo(f.p2[0], f.p2[1]);
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1;
  ctx.stroke();

  // 品号
  ctx.fillStyle = '#aaa';
  ctx.font = '10px Arial';
  ctx.textAlign = 'center';
  const midY = (f.p1[1] + f.p2[1]) / 2;
  const below = Math.max(f.p1[1], f.p2[1]) + 15;
  ctx.fillText(f.n, f.center[0], below);

  // 长度标注(前3品)
  if (f.n <= 3) {
    ctx.fillStyle = '#666';
    ctx.font = '9px Arial';
    ctx.fillText(Math.round(f.len) + 'px', f.center[0], below + 14);
  }
});

// 长度标注(最后1品)
const last = frets[frets.length-1];
ctx.fillStyle = '#666';
ctx.font = '9px Arial';
ctx.fillText(Math.round(last.len) + 'px', last.center[0], Math.max(last.p1[1], last.p2[1]) + 29);

console.log('品丝长度:', frets.map(f => `${f.n}: ${Math.round(f.len)}px`).join(', '));
</script>
</body>
</html>
